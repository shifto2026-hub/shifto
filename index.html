const toHours = m => Math.round(m/60*100)/100;
const fmtHours = h => {
  const hrs = Math.floor(h), mins = Math.round((h-hrs)*60);
  if (!hrs && !mins) return "0h";
  if (!hrs) return `${mins}m`;
  if (!mins) return `${hrs}h`;
  return `${hrs}h ${mins}m`;
};
const fmtGBP = n => new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP"}).format(n);
const dayName = d => new Date(d+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short"});
const localDate = (d=new Date()) => {
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
};
const addDays = (dateStr, n) => {
  const d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n);
  return localDate(d);
};
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEK_DAYS = [{v:1,l:"Mon"},{v:2,l:"Tue"},{v:3,l:"Wed"},{v:4,l:"Thu"},{v:5,l:"Fri"},{v:6,l:"Sat"},{v:0,l:"Sun"}];
const uuid = () => Math.random().toString(36).slice(2);
const getWeekKey = (date, wsd=1) => {
  const ds = typeof date==='string' && date.length===10 ? date+"T00:00:00" : date;
  const d = new Date(ds); d.setHours(0,0,0,0);
  const diff = (d.getDay()-wsd+7)%7; d.setDate(d.getDate()-diff);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
};
const getWeekDates = wk => Array.from({length:7},(_,i)=>{
  const d = new Date(wk+"T00:00:00"); d.setDate(d.getDate()+i);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
});
const weekLabel = wk => {
  const s=new Date(wk+"T00:00:00"), e=new Date(wk+"T00:00:00"); e.setDate(e.getDate()+6);
  return `${s.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${e.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`;
};
// Paid holiday: a day off marked holiday + paid, with hours entered by the user
const isPaidHoliday = s => !!(s && !s.working && s.isHoliday && s.holPaid);
const holidayHours = s => isPaidHoliday(s) ? (parseFloat(s.holHours)||0) : 0;
// "Counts for pay" = worked shift or paid holiday
const isPaid = s => !!(s && (s.working || isPaidHoliday(s)));
const shiftHours = s => {
  if (isPaidHoliday(s)) return holidayHours(s);
  if (!s||!s.working||!s.startTime||!s.endTime) return 0;
  let a=toMins(s.startTime), b=toMins(s.endTime);
  if (b<=a) b+=1440;
  return toHours(b-a);
};
const shiftPay = (s,rate) => shiftHours(s)*rate + (s&&s.hasSleepover ? s.sleepoversRate||60 : 0);
const getDaysInMonth = (y,m) => new Date(y,m+1,0).getDate();

// ── Multi-slot helpers ────────────────────────────────────────────────────────
// A "slot key" is either the legacy "date_aid" OR the new "date_aid_N" format.
// getSlots returns [{key, shift}] for all slots on a date+agency, sorted by start time.
const getSlots = (shifts, date, aid) => {
  const results = [];
  // Legacy key (no index suffix)
  const legKey = `${date}_${aid}`;
  if (shifts[legKey]) results.push({key:legKey, shift:shifts[legKey]});
  // Indexed keys: date_aid_0, date_aid_1, ...
  let i = 0;
  while (true) {
    const k = `${date}_${aid}_${i}`;
    if (shifts[k]) { results.push({key:k, shift:shifts[k]}); i++; }
    else if (i > 20) break; // safety
    else i++;
    if (i > 20) break;
  }
  // If we found both legacy AND indexed, deduplicate (legacy takes index 0 role)
  // Sort by start time
  results.sort((a,b)=>{
    const at = a.shift?.startTime||"00:00", bt = b.shift?.startTime||"00:00";
    return at.localeCompare(bt);
  });
  return results;
};
// Get the next available slot key for a date+agency (for adding a new slot)
const nextSlotKey = (shifts, date, aid) => {
  // If no legacy key exists, use legacy format for first slot
  if (!shifts[`${date}_${aid}`]) return `${date}_${aid}`;
  // Otherwise find next indexed slot
  for (let i = 0; i <= 20; i++) {
    const k = `${date}_${aid}_${i}`;
    if (!shifts[k]) return k;
  }
  return `${date}_${aid}_0`;
};
// Sum hours/pay across all slots for a date+agency
const dayHours = (shifts, date, aid) => getSlots(shifts,date,aid).reduce((s,{shift})=>s+shiftHours(shift),0);
const dayPay   = (shifts, date, aid, rate) => getSlots(shifts,date,aid).reduce((s,{shift})=>s+shiftPay(shift,rate),0);
const dayWorking = (shifts, date, aid) => getSlots(shifts,date,aid).some(({shift})=>shift?.working);

// Get the custom pay period that contains a given date (for monthly pay with custom start day)
const getCustomPeriod = (dateStr, startDay) => {
  const d = new Date(dateStr+"T00:00:00");
  const day = d.getDate(), m = d.getMonth(), y = d.getFullYear();
  let pStart, pEnd;
  if (day >= startDay) {
    // period started this month
    pStart = new Date(y, m, startDay);
    pEnd = new Date(y, m+1, startDay-1);
  } else {
    // period started last month
    pStart = new Date(y, m-1, startDay);
    pEnd = new Date(y, m, startDay-1);
  }
  return { start: localDate(pStart), end: localDate(pEnd) };
};

// Get current custom period
const currentCustomPeriod = (startDay) => getCustomPeriod(localDate(), startDay);

// Format a period label e.g. "21 Sep – 20 Oct 2026"
const fmtPeriodLabel = (start, end) => {
  const s = new Date(start+"T00:00:00"), e = new Date(end+"T00:00:00");
  return s.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" – "+e.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
};
const load = (k,d) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch { return d; } };
const save = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} };

// ─── Firebase Realtime Database sync ─────────────────────────────────────────
const FB_PATH = "shifto/shared";
let _fbPushFn = null;
let _fbOnRestoreFn = null;
let _fbIgnoreNext = false; // prevent echo-back loop

const registerFbPush = fn => { _fbPushFn = fn; };
const registerFbOnRestore = fn => { _fbOnRestoreFn = fn; };

const fbPush = data => {
  if (!_fbPushFn) return;
  _fbPushFn(data);
};

// Called once on app mount — sets up the live listener
const initFirebaseSync = (onRemoteData) => {
  try {
    const db = firebase.database();
    const ref = db.ref(FB_PATH);
    ref.on("value", snap => {
      if (_fbIgnoreNext) { _fbIgnoreNext = false; return; }
      const val = snap.val();
      if (!val) return;
      // Only apply if remote timestamp is newer than local
      const localTs = load("spt_fb_ts", 0);
      if (val._ts && val._ts > localTs) {
        save("spt_fb_ts", val._ts);
        if (_fbOnRestoreFn) _fbOnRestoreFn(val);
      }
    });
    return ref;
  } catch(e) { return null; }
};

let _fbPushTimer = null;
const fbPushDebounced = (data) => {
  clearTimeout(_fbPushTimer);
  _fbPushTimer = setTimeout(() => {
    try {
      const db = firebase.database();
      const ref = db.ref(FB_PATH);
      const payload = { ...data, _ts: Date.now() };
      _fbIgnoreNext = true;
      save("spt_fb_ts", payload._ts);
      ref.set(payload).catch(()=>{});
    } catch(e) {}
  }, 2000);
};

// ─── Data version migration ───────────────────────────────────────────────────
const migrateData = () => {
  const ver = load("spt_data_version", 1);
  if (ver < 2) {
    // v1→v2: rename Agency N → Workplace N in agency names
    const agencies = load("spt_agencies", null);
    if (agencies) {
      const updated = agencies.map(ag=>({...ag, name:ag.name.replace(/^Agency (\d+)$/, "Workplace $1")}));
      save("spt_agencies", updated);
    }
  }
  if (ver < 3) {
    // v2→v3: ensure prefs has rotaConfig
    const prefs = load("spt_prefs", null);
    if (prefs && !prefs.rotaConfig) {
      save("spt_prefs", {...prefs, rotaConfig:{enabled:false,startDate:"",weekADays:[],weekBDays:[]}});
    }
  }
  save("spt_data_version", DATA_VERSION);
};

// ─── Rolling rota helpers ─────────────────────────────────────────────────────
// Returns "A" or "B" for a given date based on rota start date
const getRotaWeek = (dateStr, startDate) => {
  if (!startDate) return "A";
  const start = new Date(startDate+"T00:00:00");
  const target = new Date(dateStr+"T00:00:00");
  const diffMs = target - start;
  const diffDays = Math.floor(diffMs / 86400000);
  const diffWeeks = Math.floor(diffDays / 7);
  return diffWeeks % 2 === 0 ? "A" : "B";
};

// Auto-populate partner shifts for the entire year based on rota config
const applyRota = (rotaConfig, partnerAgencies, existingShifts) => {
  if (!rotaConfig.enabled || !rotaConfig.startDate || !partnerAgencies.length) return existingShifts;
  const newShifts = {...existingShifts};
  const defaultAgId = partnerAgencies[0].id;
  const today = new Date();
  const yearStart = new Date(today.getFullYear(), 0, 1);
  const yearEnd = new Date(today.getFullYear() + 1, 11, 31);
  // First pass: remove non-manual partner rota shifts — only from today onwards.
  // Past dates are left untouched; historical data should not be overwritten.
  const todayDateOnly = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  let cur = new Date(todayDateOnly);
  while (cur <= yearEnd) {
    const dateStr = localDate(cur);
    const key = `${dateStr}_${defaultAgId}`;
    if (newShifts[key] && !newShifts[key]._manual) {
      delete newShifts[key];
    }
    cur.setDate(cur.getDate() + 1);
  }
  // Second pass: generate fresh rota shifts — ONLY from today onwards.
  // Never fill historical dates; past shifts must be logged manually.
  // Start from whichever is later: today or the rota start date.
  const rotaStartDate = new Date(rotaConfig.startDate+"T00:00:00");
  const fillFrom = rotaStartDate > today ? rotaStartDate : new Date(today.getFullYear(), today.getMonth(), today.getDate());
  cur = new Date(fillFrom);
  while (cur <= yearEnd) {
    const dateStr = localDate(cur);
    const dayOfWeek = cur.getDay(); // 0=Sun, 1=Mon...
    const week = getRotaWeek(dateStr, rotaConfig.startDate);
    const pattern = week === "A" ? (rotaConfig.weekADays||[]) : (rotaConfig.weekBDays||[]);
    const dayPattern = pattern.find(p => p.dayOfWeek === dayOfWeek);
    const key = `${dateStr}_${defaultAgId}`;
    // Never overwrite a manually-set shift (holiday, custom time, day off, etc.)
    if (!newShifts[key]?._manual) {
      if (dayPattern) {
        newShifts[key] = {
          id: uuid(), agencyId: defaultAgId, working: true,
          startTime: dayPattern.startTime || "07:00",
          endTime: dayPattern.endTime || "19:00",
          note: "", hasSleepover: false, sleepoversRate: 60,
          slpStart: "", slpEnd: "", continuesNext: false,
          _rota: true
        };
      }
      // If no pattern for this day and no manual shift, leave it as-is (no shift = off)
    }
    cur.setDate(cur.getDate() + 1);
  }
  return newShifts;
};

const gDrive = {
  _token:null, _signedIn:false, _email:null,
  async token(silent=false) {
    if (this._token && this._token.exp>Date.now()) return this._token.tok;
    if (!window.google?.accounts?.oauth2) throw new Error("Google sign-in script not loaded. Check your internet connection and reload.");

  },
  async save(data) {
    const t=await this.token(), j=JSON.stringify(data);

    const found=await q.json(), id=found.files?.[0]?.id;

    form.append("metadata",new Blob([JSON.stringify(meta)],{type:"application/json"}));

    const r=await fetch(id?`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=multipart`:"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
      {method:id?"PATCH":"POST",headers:{Authorization:"Bearer "+t},body:form});
    if (!r.ok) throw new Error("Save failed");
  },
  async load() {
    const t=await this.token();
    const q=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'shifto-backup.json'&fields=files(id)",{headers:{Authorization:"Bearer "+t}});

// ─── Google Sync component ────────────────────────────────────────────────────
const GoogleSync = ({getData,onRestore}) => {
  const [status,setStatus] = useState("idle");
  const [msg,setMsg] = useState("");
  const [signedIn,setSignedIn] = useState(gDrive._signedIn);
  const [userEmail,setUserEmail] = useState(gDrive._email||null);
  const googleReady = !!(window.google?.accounts?.oauth2);

  const signIn = async () => {
    setStatus("signing-in"); setMsg("");
    try {
      await gDrive.token(false);
      // Try to get user info
      try {
        const t = gDrive._token?.tok;
        const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+t}});
        const info = await res.json();
        gDrive._email = info.email;
        setUserEmail(info.email);
      } catch(e){}
      setSignedIn(true); gDrive._signedIn=true;
      setStatus("idle"); setMsg("Signed in ✓");
    } catch(e) { setStatus("err"); setMsg("Sign-in failed: "+e.message); }
  };

  const signOut = () => {
    gDrive._token=null; gDrive._signedIn=false; gDrive._email=null;
    setSignedIn(false); setUserEmail(null); setMsg("");setStatus("idle");
  };

  const doSave = async () => {
    setStatus("saving"); setMsg("");
    try { await gDrive.save(getData()); save("spt_last_sync",Date.now()); setStatus("ok"); setMsg("Saved to Drive ✓"); }
    catch(e) { setStatus("err"); setMsg("Failed: "+e.message); }
  };
  const doLoad = async () => {
    setStatus("loading"); setMsg("");
    try {
      const d=await gDrive.load(); if (!d) { setStatus("err"); setMsg("No backup found on Drive"); return; }
      onRestore(d); save("spt_last_sync",Date.now()); setStatus("ok"); setMsg("Restored ✓");
    } catch(e) { setStatus("err"); setMsg("Failed: "+e.message); }
  };

  const busy = status==="saving"||status==="loading"||status==="signing-in";

  if (!googleReady) return React.createElement("div",{style:{fontSize:12,color:TEXT3,fontFamily:"'DM Sans',sans-serif",lineHeight:1.6,background:`${BORDER}44`,borderRadius:10,padding:"10px 12px"}},
    "⚠️ Google Sign-In requires Safari. Open Shifto in Safari (not inside another app) to use Drive sync. Use ",
    React.createElement("strong",null,"Backup & Restore"),
    " below as an alternative."
  );

  // Not signed in — show prominent sign-in button
  if (!signedIn) return React.createElement("div",null,
    React.createElement("button",{onClick:signIn,disabled:busy,style:{
      width:"100%",padding:"13px",borderRadius:12,cursor:"pointer",

  // Adjustment fields — persisted in prefs keyed by person + weekKey (week adj)
  // Month adj is keyed by YYYY-MM of the "billing month" (end month of the pay period)
  // e.g. October adjustment → key "2026-10" → maps to Sep 21–Oct 20 payroll for 21st-start agencies
  const adjPfx = (isPartnerView?"partner":"my")+"Adj_"+weekKey;
  const savedWeekAdj  = prefs[adjPfx+"_week"]  || {label:"", amount:""};
  // Month adj key: use the month of the currently viewed week's Monday

  const monthAdjPfx = (isPartnerView?"partner":"my")+"MonthAdj_"+viewedMonthKey;
  const savedMonthAdj = prefs[monthAdjPfx] || {label:"", amount:""};
  const setWeekAdj  = (updater) => {
    const next = typeof updater==="function" ? updater(savedWeekAdj) : updater;
    setPrefs && setPrefs(p=>({...p, [adjPfx+"_week"]: next}));
  };
  const setMonthAdj = (updater) => {
    const next = typeof updater==="function" ? updater(savedMonthAdj) : updater;
    setPrefs && setPrefs(p=>({...p, [monthAdjPfx]: next}));
  };
  const weekAdj  = savedWeekAdj;
  const monthAdj = savedMonthAdj;

  // Year-end tax adjustment — persisted in prefs
  // Positive = HMRC owes you (refund), Negative = you owe HMRC (underpayment)
  const taxYearAdj = parseFloat(prefs?.taxYearAdj)||0;
  const setTaxYearAdj = (val) => setPrefs && setPrefs(p=>({...p, taxYearAdj: val}));
  const [taxAdjInput, setTaxAdjInput] = useState(taxYearAdj!==0 ? String(Math.abs(taxYearAdj)) : "");

  // Per-month spread: divide annual adj by 12
  const taxAdjPerMonth = taxYearAdj / 12;

  // Active agency stats
  const activeAgStat = weekStats.find(a=>a.id===activeAgId)||weekStats[0];
  const activeAgMonthStat = (agencyMonthStats&&activeAgId&&agencyMonthStats[activeAgId])||{hours:0,pay:0};

  // Helper: net take-home for a single agency — monthly gross, monthly pay frequency.

  // This means October (more hours) → higher gross → higher deductions → lower net rate.
  // A month with zero hours gives zero tax, not 1/12 of annual tax on an assumed salary.
  const agNetPay = (agId, gross) => {
    if (!agId || !payDetails || gross <= 0) return null;
    const pd = Array.isArray(payDetails) ? payDetails.find(p=>p.agencyId===agId) : null;
    if (!pd || !pd.taxCode) return null;
    const freq = pd.frequency||"Monthly";

    if (!pd || !pd.taxCode) return null;
    const freq = pd.frequency||"Weekly";
    const r = calcUKNetPayFromPeriodGross(gross, pd.taxCode, pd.niCategory||"A – Standard", pd.studentLoan||"None", parseFloat(pd.pension)||0, parseFloat(pd.otherDeductions)||0, pd.taxYear, freq);

      const net = agNetPay(agId, stat.pay);

  const hasMonthBreakdown = monthAgBreakdown.length > 0;

// ─── Monthly Goal Card (shown at top of payment list) ─────────────────────────
const MonthlyGoalCard = ({allRows, person, prefs, setPrefs, agencyMonthStats, payDetails, agencies, GREEN_C, bg2, bg3, bdr, txt, txt2, txt3, T}) => {
  // Light theme: jar + progress bar in navy; dark theme keeps the green
  const GOALC = (prefs.theme||"dark")==="dark" ? "#c9a843" : "#1a2744";
  const pfx = person==="me" ? "my" : "partner";

  const thisMonth = new Date().toISOString().slice(0,7);
  const monthRows = React.useMemo(()=>
    allRows.filter(r=>{ const ref=r.periodStart||r.periodEnd; return ref&&ref.slice(0,7)===thisMonth; })
  ,[allRows, thisMonth]);
  const monthGross   = monthRows.reduce((s,r)=>s+r.gross, 0);

  // Use the same net calculation as the footer: total monthly gross per agency → one tax calc.
  // This ensures the goal card shows the same number as the footer.
  const monthEarned = React.useMemo(()=>{
    if (agencyMonthStats && payDetails && agencies) {
      const breakdown = Object.entries(agencyMonthStats)
        .map(([agId, stat]) => {
          if (!stat || stat.pay <= 0) return null;
          const pd = Array.isArray(payDetails) ? payDetails.find(p=>p.agencyId===agId) : null;
          if (!pd || !pd.taxCode) return { gross: stat.pay, net: null };
          const r = calcUKNetPayFromPeriodGross(stat.pay, pd.taxCode, pd.niCategory||"A – Standard", pd.studentLoan||"None", parseFloat(pd.pension)||0, parseFloat(pd.otherDeductions)||0, pd.taxYear, "Monthly");
          return { gross: stat.pay, net: r?.net ?? null };
        })
        .filter(Boolean);
      if (breakdown.length > 0) {
        return breakdown.reduce((s,b) => s + (b.net != null ? b.net : b.gross), 0);
      }
    }
    // Fallback: use gross from allRows
    return monthGross;
  }, [agencyMonthStats, payDetails, agencies, monthGross]);
  const monthLabel   = new Date().toLocaleString("en-GB",{month:"short",year:"numeric"});

  const goalKey   = pfx+"EarningsGoal";
  const rewardKey = pfx+"RewardPer100";
  const goal      = parseFloat(prefs[goalKey]) || 0;
  const reward    = parseFloat(prefs[rewardKey]) || 10;

  const [editGoal,   setEditGoal]   = React.useState(false);
  const [goalInput,  setGoalInput]  = React.useState(goal > 0 ? String(goal) : "");
  const [rewardInput,setRewardInput]= React.useState(reward > 0 ? String(reward) : "10");
  const [confetti,   setConfetti]   = React.useState([]);
  const prevRewards = React.useRef(0);

  const saveGoal = () => {
    if (!setPrefs) return;
    const g = parseFloat(goalInput) || 0;
    const rw = parseFloat(rewardInput) || 10;
    setPrefs(p=>({...p, [goalKey]:g, [rewardKey]:rw}));
    setEditGoal(false);
  };

  const fmtGBP = v => "£"+v.toFixed(2);

  const extra     = goal > 0 ? Math.max(0, monthEarned - goal) : 0;
  const rewards   = goal > 0 ? Math.floor(extra / 100) : 0;
  const rewardAmt = rewards * reward;
  const pct       = goal > 0 ? Math.min(100, (monthEarned / goal) * 100) : 0;
  const nextAt    = goal > 0 ? goal + (rewards + 1) * 100 : 0;
  const toNext    = goal > 0 ? Math.max(0, nextAt - monthEarned) : 0;
  const jarPct    = goal > 0 ? Math.min(100, Math.round(monthEarned/goal*100)) : 0;

  React.useEffect(()=>{
    if (rewards > prevRewards.current && rewards > 0) {
      const COLORS=["#c9a843","#fbbf24","#f97316","#60a5fa","#e879f9","#f43f5e"];
      const pieces = Array.from({length:22},(_,i)=>({
        id:i, left:Math.random()*90+5,
        color:COLORS[i%COLORS.length],
        size:6+Math.random()*6,
        delay:Math.random()*0.4,
        dur:0.8+Math.random()*0.5
      }));
      setConfetti(pieces);
      setTimeout(()=>setConfetti([]),1800);
    }
    prevRewards.current = rewards;
  },[rewards]);

  const NG = "#c9a843"; // gold
  const NW = "#c9a843"; // use gold — white is invisible on this device
  const NL = "rgba(201,168,67,0.75)";

  // Jar SVG — outlined, gold fill proportional to progress
  const jarFill = goal > 0 ? Math.min(1, jarPct/100) : 0;
  const jarIcon = React.createElement("svg",{width:38,height:50,viewBox:"0 0 38 50",fill:"none"},
    // jar body
    React.createElement("rect",{x:5,y:12,width:28,height:33,rx:5,fill:`rgba(201,168,67,${0.1+jarFill*0.5})`,stroke:NG,strokeWidth:2}),
    // fill level
    jarFill>0&&React.createElement("rect",{x:7,y:12+33*(1-jarFill),width:24,height:33*jarFill,rx:jarFill>=1?4:0,fill:NG,opacity:0.85}),
    // lid
    React.createElement("rect",{x:3,y:6,width:32,height:8,rx:3,fill:NG}),
    // shine line
    React.createElement("line",{x1:12,y1:18,x2:12,y2:40,stroke:"rgba(255,255,255,0.3)",strokeWidth:2.5,strokeLinecap:"round"})
  );

  return React.createElement("div",{style:{position:"relative",marginBottom:12}},
    confetti.length>0&&React.createElement("div",{style:{position:"absolute",inset:0,pointerEvents:"none",overflow:"hidden",zIndex:20,borderRadius:16}},
      confetti.map(p=>React.createElement("div",{key:p.id,style:{
        position:"absolute",top:0,left:p.left+"%",
        width:p.size,height:p.size,borderRadius:p.id%3===0?"50%":2,
        background:p.color,
        animation:`confettiFall ${p.dur}s ${p.delay}s ease-in forwards`
      }}))
    ),
    // Navy card
    React.createElement("div",{style:{
      background:"linear-gradient(135deg,#1e2c4d 0%,#1a2744 55%,#22335a 100%)",
      borderRadius:16,padding:"14px 14px 12px",
      border:"1px solid rgba(255,255,255,0.10)",
      boxShadow:"0 4px 14px rgba(26,39,68,0.28)",
      color:"#ffffff"
    }},
      // Header: title + Edit button
      React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}},
        React.createElement("div",{style:{fontSize:12,fontWeight:800,color:NG,textTransform:"uppercase",letterSpacing:"0.06em",fontFamily:"'DM Sans',sans-serif",opacity:1}},
          "MONTHLY GOAL — "+monthLabel.toUpperCase()
        ),
        React.createElement("button",{
          onClick:()=>setEditGoal(s=>!s),
          style:{background:NG,color:"#1a2744",border:"none",borderRadius:999,padding:"5px 14px",fontSize:12,fontWeight:800,fontFamily:"'DM Sans',sans-serif",cursor:"pointer"}
        }, editGoal ? "Cancel" : (goal>0?"Edit":"Set goal"))
      ),
      // Edit form
      editGoal&&React.createElement("div",{style:{marginBottom:12,display:"flex",flexDirection:"column",gap:8}},
        React.createElement("div",{style:{fontSize:11,color:NL,fontFamily:"'DM Sans',sans-serif"}},"Monthly target:"),
        React.createElement("input",{type:"number",value:goalInput,onChange:e=>setGoalInput(e.target.value),placeholder:"e.g. 2000",
          style:{background:"rgba(255,255,255,0.08)",border:`1px solid ${NG}66`,borderRadius:8,padding:"8px 10px",color:NW,fontFamily:"'DM Mono',monospace",fontSize:16,width:"100%",boxSizing:"border-box",outline:"none"}}),
        React.createElement("div",{style:{fontSize:11,color:NL,fontFamily:"'DM Sans',sans-serif"}},"Reward per £100 above goal:"),
        React.createElement("input",{type:"number",value:rewardInput,onChange:e=>setRewardInput(e.target.value),placeholder:"e.g. 10",
          style:{background:"rgba(255,255,255,0.08)",border:`1px solid ${NG}66`,borderRadius:8,padding:"8px 10px",color:NW,fontFamily:"'DM Mono',monospace",fontSize:16,width:"100%",boxSizing:"border-box",outline:"none"}}),
        React.createElement("button",{onClick:saveGoal,
          style:{padding:"9px",borderRadius:9,border:"none",background:NG,color:"#1a2744",fontFamily:"'DM Sans',sans-serif",fontWeight:800,fontSize:13,cursor:"pointer"}},
          "Save")
      ),
      // No goal set
      goal<=0&&!editGoal&&React.createElement("div",{style:{textAlign:"center",color:NL,fontFamily:"'DM Sans',sans-serif",fontSize:12,padding:"8px 0"}},
        "Tap Set goal to start tracking 🎯"),
      // Goal content
      goal>0&&!editGoal&&React.createElement("div",null,
        // Body row: jar + amount/bar + pct
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:14,marginBottom:10}},
          jarIcon,
          React.createElement("div",{style:{flex:1,minWidth:0}},
            React.createElement("div",{style:{fontSize:16,fontWeight:700,color:NG,fontFamily:"'DM Mono',monospace",fontVariantNumeric:"tabular-nums",letterSpacing:"-0.01em",marginBottom:7}},
              fmtGBP(monthEarned)+" / "+fmtGBP(goal)
            ),
            React.createElement("div",{style:{height:9,borderRadius:5,background:"rgba(120,140,180,0.3)",overflow:"hidden"}},
              React.createElement("div",{style:{height:"100%",width:Math.round(pct)+"%",borderRadius:5,background:NG,transition:"width 0.7s ease"}})
            )
          ),
          React.createElement("div",{style:{fontSize:22,fontWeight:800,color:NG,fontFamily:"'DM Mono',monospace",fontVariantNumeric:"tabular-nums",flexShrink:0}},
            Math.round(pct)+"%"
          )
        ),
        // Reward banner
        rewards>0&&React.createElement("div",{style:{background:`${NG}18`,border:`1px solid ${NG}44`,borderRadius:10,padding:"8px 12px",marginBottom:8,textAlign:"center"}},
          React.createElement("div",{style:{fontSize:13,fontWeight:800,color:NG,fontFamily:"'DM Sans',sans-serif"}},"🎉 "+rewards+" reward"+(rewards!==1?"s":"")+" earned — "+fmtGBP(rewardAmt)+" to treat yourself!")
        ),
        // Footer text
        React.createElement("div",{style:{textAlign:"center",fontSize:11,color:"rgba(255,255,255,0.7)",fontFamily:"'DM Sans',sans-serif",fontVariantNumeric:"tabular-nums"}},
          pct>=100 ? "🎉 Goal reached!" :
          rewards>0 ? "£"+toNext.toFixed(2)+" to next reward (+"+fmtGBP(reward)+")" :
          "£"+toNext.toFixed(2)+" to reach your goal this month"

};

// ─── Earnings Summary (all-time totals — bottom of payment list) ───────────────
const EarningsSummary = ({rows, allRows, person, prefs, setPrefs, GREEN_C, bg2, bg3, bdr, txt, txt2, txt3, T}) => {
  // Totals across ALL rows for the all-time summary card
  const totalGross = allRows.reduce((s,r)=>s+r.gross, 0);
  const totalNet   = allRows.reduce((s,r)=>s+(r.net||0), 0);
  const netKnown   = allRows.some(r=>r.net!=null);

  // Per-agency net breakdown (all rows)
  const agSummary = React.useMemo(()=>{
    const map={};
    allRows.forEach(r=>{
      if(!map[r.agId]) map[r.agId]={agName:r.agName,agColor:r.agColor,gross:0,net:0,netKnown:false};
      map[r.agId].gross+=r.gross;
      if(r.net!=null){map[r.agId].net+=r.net; map[r.agId].netKnown=true;}
    });
    return Object.values(map);
  },[allRows]);

  const fmtGBP = v => "£"+v.toFixed(2);

  if (allRows.length === 0) return null;

  return React.createElement("div",{style:{marginTop:4}},
    React.createElement("div",{style:{background:bg2,borderRadius:12,padding:"14px",border:`1px solid ${bdr}`}},
      React.createElement("div",{style:{fontSize:10,fontWeight:700,color:txt3,textTransform:"uppercase",letterSpacing:"0.07em",fontFamily:"'DM Sans',sans-serif",marginBottom:10}},"All-time earnings"),
      agSummary.map(ag=>

const TimesheetReminder = ({agencies, person, prefs, setPrefs, T}) => {
  const bg2=T.bg2, bg3=T.bg3, bdr=T.border, bdr2=T.inputBorder;

  const [notifPerm, setNotifPerm] = useState(typeof Notification!=="undefined"?Notification.permission:"denied");
  const reminders = prefs.timesheetReminders || [];

  const requestPerm = async () => {
    if (typeof Notification==="undefined") return;
    const res = await Notification.requestPermission();
    setNotifPerm(res);
  };

  const upsertReminder = (agId, field, val) => {
    setPrefs(p=>{
      const existing = (p.timesheetReminders||[]);
      const idx = existing.findIndex(r=>r.agId===agId&&r.person===person);
      let updated;
      if (idx>=0) {
        updated = existing.map((r,i)=>i===idx?{...r,[field]:val}:r);
      } else {
        const ag = agencies.find(a=>a.id===agId);
        updated = [...existing, {agId, agName:ag?.name||agId, person, freq:"weekly", dayOfWeek:0, dayOfMonth:1, [field]:val}];
      }
      return {...p, timesheetReminders:updated};
    });
  };

  const removeReminder = agId => {
    setPrefs(p=>({...p, timesheetReminders:(p.timesheetReminders||[]).filter(r=>!(r.agId===agId&&r.person===person))}));

      return React.createElement("div",{key:ag.id,style:{

        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:isOn?12:0}},
          React.createElement("div",{style:{width:8,height:8,borderRadius:"50%",background:ag.color,flexShrink:0}}),

// ─── "What matters today" Focus Mode ──────────────────────────────────────────
const FocusMode = ({myAgencies,myShifts,partnerAgencies,partnerShifts,prefs,T}) => {
  const today = localDate();
  const isDark = T.isDark;
  const bg2=T.bg2, bdr=T.border;
  const txt=T.text, txt2=T.text2, txt3=T.sectionLabel;
  const acc=T.blue;
  const [visible,setVisible] = useState(false);

  // Did I log yesterday?
  const yesterday = (()=>{ const d=new Date(today+"T00:00:00"); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); })();
  const loggedYesterday = myAgencies.some(ag=>myShifts[`${yesterday}_${ag.id}`]);

  // On track this week?
  const wsd = prefs.weekStartDay||1;
  const weekKey = getWeekKey(today,wsd);
  const weekDates = getWeekDates(weekKey);
  const pastDates = weekDates.filter(d=>d<today);
  const loggedCount = pastDates.filter(d=>myAgencies.some(ag=>myShifts[`${d}_${ag.id}`])).length;
  const onTrack = pastDates.length===0 || loggedCount>=pastDates.length;

  // Working today?
  const workingToday = myAgencies.some(ag=>myShifts[`${today}_${ag.id}`]?.working);

  // Next payday for each agency
  const payDates = (() => {
    const results=[];
    const pd = prefs.myPayDetails||[];
    myAgencies.forEach(ag=>{
      const p = Array.isArray(pd)?pd.find(x=>x.agencyId===ag.id):null;
      if (!p) return;
      const startDay = parseInt(p.payPeriodStart)||1;
      const [ry,rm,rd] = today.split("-").map(Number);
      let nextMonth = rm, nextYear = ry;
      // If today's day < startDay, payday is still this month; else next month
      if (rd >= startDay) { nextMonth = rm===12?1:rm+1; nextYear = rm===12?ry+1:ry; }
      const payDate = `${nextYear}-${String(nextMonth).padStart(2,"0")}-${String(startDay).padStart(2,"0")}`;
      const diff = Math.round((new Date(payDate+"T00:00:00")-new Date(today+"T00:00:00"))/(1000*60*60*24));
      results.push({agName:ag.name,color:ag.color,payDate,daysLeft:diff});
    });
    return results.sort((a,b)=>a.daysLeft-b.daysLeft);
  })();

  const formatDate = ds => new Date(ds+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});

  return React.createElement("div",{style:{
    background:bg2,borderRadius:14,border:`1px solid ${isDark?"#c9a84344":"#c9a84344"}`,
    marginTop:12,overflow:"hidden"
  }},
    // Collapsible header
    React.createElement("button",{onClick:()=>setVisible(v=>!v),style:{
      width:"100%",padding:"13px 16px",background:"none",border:"none",cursor:"pointer",
      display:"flex",alignItems:"center",justifyContent:"space-between"
    }},
      React.createElement("span",{style:{fontSize:14,fontWeight:800,color:isDark?"#c9a843":"#c9a843",fontFamily:"'DM Sans',sans-serif"}},"🎯 What matters today?"),
      React.createElement("span",{style:{fontSize:14,color:isDark?"#c9a843":"#c9a843",transition:"transform 0.2s",display:"inline-block",transform:visible?"rotate(180deg)":"rotate(0deg)"}},"▾")
    ),
    // Expandable content
    visible&&React.createElement("div",{style:{padding:"0 16px 16px"}},
    React.createElement("div",{style:{height:1,background:isDark?"#c9a84322":"#c9a84322",marginBottom:14}}),
    // Yesterday logged?
    React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:10}},
      React.createElement("div",{style:{
        width:32,height:32,borderRadius:"50%",background:loggedYesterday?"#c9a84322":"#ef444422",
        display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0
      }},loggedYesterday?"✅":"⚠️"),
      React.createElement("div",null,
        React.createElement("div",{style:{fontSize:12,fontWeight:700,color:txt,fontFamily:"'DM Sans',sans-serif"}},"Yesterday logged"),
        React.createElement("div",{style:{fontSize:11,color:txt3,fontFamily:"'DM Sans',sans-serif"}},loggedYesterday?"Shift recorded for yesterday":"⚠️ Yesterday is unlogged!")
      )
    ),
    // On track?
    React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:10}},
      React.createElement("div",{style:{
        width:32,height:32,borderRadius:"50%",background:onTrack?"#c9a84322":"#f9731622",
        display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0
      }},onTrack?"📈":"📉"),
      React.createElement("div",null,
        React.createElement("div",{style:{fontSize:12,fontWeight:700,color:txt,fontFamily:"'DM Sans',sans-serif"}},"This week"),
        React.createElement("div",{style:{fontSize:11,color:txt3,fontFamily:"'DM Sans',sans-serif"}},
          onTrack ? `${loggedCount}/${pastDates.length} days logged — on track!` : `Only ${loggedCount}/${pastDates.length} days logged this week`)
      )
    ),
    // Working today?
    React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:10}},
      React.createElement("div",{style:{
        width:32,height:32,borderRadius:"50%",background:workingToday?"#60a5fa22":"#94a3b822",

      React.createElement("div",{style:{

// ─── Partner vs Stats + Household ─────────────────────────────────────────────
const PartnerComparison = ({myAgencies,myShifts,partnerAgencies,partnerShifts,myPayDetails,partnerPayDetails,prefs,T}) => {
  const today = localDate();
  const wsd = prefs.weekStartDay||1;
  const weekKey = getWeekKey(today,wsd);
  const weekDates = getWeekDates(weekKey);
  const acc=T.blue, isDark=T.isDark;
  const bg2=T.bg2, bdr=T.border, txt=T.text, txt2=T.text2, txt3=T.sectionLabel;
  const myName = prefs.myName||"Person 1";
  const pName  = prefs.partnerName||"Person 2";

  const calcWeekStats = (agencies, shifts, payDetails) => {
    let hours=0, pay=0, worked=0;
    // Collect gross per agency
    const agGross = {};
    weekDates.forEach(d=>{
      agencies.forEach(ag=>{
        const s=shifts[`${d}_${ag.id}`];
        if (isPaid(s)) {
          hours += shiftHours(s);
          const g = shiftPay(s, ag.rate);
          agGross[ag.id] = (agGross[ag.id]||0) + g;
          worked++;
        }
      });
    });
    // Compute net per agency using their pay frequency, fall back to gross if no tax details
    Object.entries(agGross).forEach(([agId, gross])=>{
      const pd = Array.isArray(payDetails) ? payDetails.find(p=>p.agencyId===agId) : null;
      if (pd && pd.taxCode) {
        const freq = pd.frequency||"Weekly";
        const r = calcUKNetPayFromPeriodGross(gross, pd.taxCode, pd.niCategory||"A – Standard", pd.studentLoan||"None", parseFloat(pd.pension)||0, parseFloat(pd.otherDeductions)||0, pd.taxYear, freq);
        pay += (r && r.net != null) ? r.net : gross;
      } else {
        pay += gross;
      }
    });
    return {hours, pay, worked};
  };

  const my = calcWeekStats(myAgencies, myShifts, myPayDetails||[]);
  const pt = calcWeekStats(partnerAgencies, partnerShifts, partnerPayDetails||[]);
  const household = my.pay + pt.pay;

  const winner = my.pay > pt.pay ? myName : pt.pay > my.pay ? pName : null;
  const myPct  = household>0 ? Math.round(my.pay/household*100) : 50;
  const ptPct  = 100-myPct;

  return React.createElement("div",{style:{
    background:bg2,borderRadius:14,border:`1px solid ${bdr}`,padding:"14px",marginBottom:12
  }},
    React.createElement("div",{style:{fontSize:10,fontWeight:700,color:txt3,textTransform:"uppercase",letterSpacing:"0.07em",fontFamily:"'DM Sans',sans-serif",marginBottom:12}},"🏆 This week's battle"),
    // Split bar
    React.createElement("div",{style:{display:"flex",height:10,borderRadius:5,overflow:"hidden",marginBottom:12}},
      React.createElement("div",{style:{width:myPct+"%",background:isDark?"#60a5fa":"#3b82f6",transition:"width 0.6s"}}),
      React.createElement("div",{style:{flex:1,background:isDark?"#fb923c":"#f97316",transition:"width 0.6s"}})
    ),
    // Stats
    React.createElement("div",{style:{display:"flex",gap:8,marginBottom:10}},
      // Me
      React.createElement("div",{style:{flex:1,padding:"10px",borderRadius:10,background:isDark?"#60a5fa18":"#dbeafe",border:`1px solid ${isDark?"#60a5fa44":"#93c5fd"}`}},
        React.createElement("div",{style:{fontSize:11,fontWeight:700,color:isDark?"#60a5fa":"#1d4ed8",fontFamily:"'DM Sans',sans-serif",marginBottom:4}},myName),
        React.createElement("div",{style:{fontSize:15,fontWeight:800,color:isDark?"#60a5fa":"#1e3a5f",fontFamily:"'DM Mono',monospace"}}, "£"+my.pay.toFixed(2)),
        React.createElement("div",{style:{fontSize:11,color:txt3,fontFamily:"'DM Sans',sans-serif"}},my.hours.toFixed(1)+"h · "+my.worked+"d")
      ),
      // Partner
      React.createElement("div",{style:{flex:1,padding:"10px",borderRadius:10,background:isDark?"#fb923c18":"#ffedd5",border:`1px solid ${isDark?"#fb923c44":"#fdba74"}`}},
        React.createElement("div",{style:{fontSize:11,fontWeight:700,color:isDark?"#fb923c":"#c2410c",fontFamily:"'DM Sans',sans-serif",marginBottom:4}},pName),
        React.createElement("div",{style:{fontSize:15,fontWeight:800,color:isDark?"#fb923c":"#7c2d12",fontFamily:"'DM Mono',monospace"}}, "£"+pt.pay.toFixed(2)),
        React.createElement("div",{style:{fontSize:11,color:txt3,fontFamily:"'DM Sans',sans-serif"}},pt.hours.toFixed(1)+"h · "+pt.worked+"d")
      )
    ),
    // Winner callout
    winner&&React.createElement("div",{style:{textAlign:"center",fontSize:12,fontWeight:700,color:txt2,fontFamily:"'DM Sans',sans-serif",marginBottom:8}},
      "👑 "+winner+" is winning this week!"
    ),
    // Household total
    React.createElement("div",{style:{
      background:isDark?"#c9a84314":"#f7efd6",border:`1px solid ${isDark?"#c9a84344":"#e0c878"}`,
      borderRadius:10,padding:"10px 12px",display:"flex",alignItems:"center",justifyContent:"space-between"
    }},
      React.createElement("div",{style:{fontSize:11,color:txt3,fontFamily:"'DM Sans',sans-serif"}},"🏠 Household this week"),
      React.createElement("div",{style:{fontSize:16,fontWeight:800,color:isDark?"#c9a843":"#c9a843",fontFamily:"'DM Mono',monospace"}},"£"+household.toFixed(2))

// ─── Dynamic tax rate store (built-ins + user-added, persisted in localStorage) ─
const BUILTIN_TAX_RATES = UK_TAX_RATES;
const loadTaxRates = () => {
  try {
    const stored = JSON.parse(localStorage.getItem("spt_tax_rates") || "null");
    if (stored && typeof stored === "object") return { ...BUILTIN_TAX_RATES, ...stored };
  } catch(e) {}
  return { ...BUILTIN_TAX_RATES };
};
const saveTaxRates = (rates) => {
  // Only persist user-added/edited years (not builtins, to keep file size down)
  const userRates = {};
  Object.keys(rates).forEach(y => {
    if (!BUILTIN_TAX_RATES[y] || JSON.stringify(rates[y]) !== JSON.stringify(BUILTIN_TAX_RATES[y])) {
      userRates[y] = rates[y];
    }
  });
  localStorage.setItem("spt_tax_rates", JSON.stringify(userRates));
};

// Returns rates for a given tax year label, falling back to the latest known
const getTaxRates = (taxYear, ratesOverride) => {
  const R = ratesOverride || loadTaxRates();
  if (taxYear && R[taxYear]) return R[taxYear];
  const keys = Object.keys(R).sort();
  return R[keys[keys.length - 1]];
};

// ─── UK Net Pay Calculator ────────────────────────────────────────────────────
// Pass taxYear (e.g. "2025/26") — automatically uses the matching rate table.
const calcUKNetPay = (grossAnnual, taxCode, niCategory, studentLoan, pensionPct, otherMonthly, taxYear) => {
  const R = getTaxRates(taxYear);

  // Resolve personal allowance from tax code
  let personalAllowance = R.personalAllowance;
  if (taxCode === "BR" || taxCode === "0T") personalAllowance = 0;
  else if (taxCode === "NT") {
    return { gross: grossAnnual, incomeTax: 0, ni: 0, pension: 0, studentLoanAmt: 0, otherAnnual: otherMonthly * 12, net: grossAnnual - otherMonthly * 12 };
  } else if (taxCode === "D0") {
    const tax = grossAnnual * R.higherRate;
    const niAmt = calcNI(grossAnnual, niCategory, R);
    const penAmt = grossAnnual * ((parseFloat(pensionPct)||0) / 100);
    const sl = calcStudentLoan(grossAnnual, studentLoan, R);
    const other = otherMonthly * 12;
    return { gross: grossAnnual, incomeTax: tax, ni: niAmt, pension: penAmt, studentLoanAmt: sl, otherAnnual: other, net: grossAnnual - tax - niAmt - penAmt - sl - other };
  } else if (taxCode === "D1") {
    const tax = grossAnnual * R.additionalRate;
    const niAmt = calcNI(grossAnnual, niCategory, R);
    const penAmt = grossAnnual * ((parseFloat(pensionPct)||0) / 100);
    const sl = calcStudentLoan(grossAnnual, studentLoan, R);
    const other = otherMonthly * 12;
    return { gross: grossAnnual, incomeTax: tax, ni: niAmt, pension: penAmt, studentLoanAmt: sl, otherAnnual: other, net: grossAnnual - tax - niAmt - penAmt - sl - other };
  } else if (taxCode && taxCode.startsWith("K")) {
    const kNum = parseInt(taxCode.slice(1)) || 0;
    personalAllowance = -(kNum * 10);
  } else {
    // Standard L code (e.g. 1257L → £12,570 allowance)
    const num = parseInt(taxCode) || Math.round(R.personalAllowance / 10);
    personalAllowance = num * 10;
  }

  const pensionAmount = grossAnnual * ((parseFloat(pensionPct)||0) / 100);
  const taxableIncome = Math.max(0, grossAnnual - pensionAmount - personalAllowance);

  let incomeTax = 0;
  if (taxableIncome > 0) {
    const basicTop   = R.basicRateCeiling  - R.personalAllowance;
    const higherTop  = R.higherRateCeiling - R.personalAllowance;
    const basicBand  = Math.min(taxableIncome, basicTop);
    const higherBand = Math.min(Math.max(taxableIncome - basicTop, 0), higherTop - basicTop);
    const addlBand   = Math.max(taxableIncome - higherTop, 0);
    incomeTax = basicBand * R.basicRate + higherBand * R.higherRate + addlBand * R.additionalRate;
  }

  const niAmt = calcNI(grossAnnual, niCategory, R);
  const sl = calcStudentLoan(grossAnnual, studentLoan, R);
  const other = otherMonthly * 12;
  const net = grossAnnual - incomeTax - niAmt - pensionAmount - sl - other;
  return { gross: grossAnnual, incomeTax, ni: niAmt, pension: pensionAmount, studentLoanAmt: sl, otherAnnual: other, net: Math.max(0, net) };
};

const calcNI = (grossAnnual, niCategory, R) => {
  if (!R) R = getTaxRates();
  if (niCategory && niCategory.startsWith("C")) return 0;
  if (grossAnnual <= R.niPrimaryThreshold) return 0;
  const mainRate = niCategory && niCategory.startsWith("B") ? R.niMainRateCatB : R.niMainRateCatA;
  const mainNI = Math.min(grossAnnual, R.niUpperEarningsLimit) - R.niPrimaryThreshold;
  const addlNI = Math.max(grossAnnual - R.niUpperEarningsLimit, 0);
  return mainNI * mainRate + addlNI * R.niAdditionalRate;
};

const calcStudentLoan = (grossAnnual, plan, R) => {
  if (!plan || plan === "None") return 0;
  if (!R) R = getTaxRates();
  const entry = R.studentLoan[plan];
  if (!entry) return 0;
  return Math.max(0, grossAnnual - entry.threshold) * entry.rate;
};

// ─── Period-based net pay calculator ─────────────────────────────────────────
// Calculates tax/NI on the ACTUAL gross for a given pay period (weekly or monthly),
// without annualising. Uses a proportional slice of annual thresholds for the period.
// This gives the correct deductions for a period with variable hours — e.g. if you
// worked more in October than September, October shows higher tax, not the same figure.
// freq: "Weekly"|"Fortnightly"|"Monthly"|"4-weekly"
const calcUKNetPayFromPeriodGross = (periodGross, taxCode, niCategory, studentLoan, pensionPct, otherMonthly, taxYear, freq) => {
  if (!periodGross || periodGross <= 0) return { gross:0, incomeTax:0, ni:0, pension:0, studentLoanAmt:0, otherAmt:0, net:0 };
  const R = getTaxRates(taxYear);
  const freqPeriods = { "Weekly":52, "Fortnightly":26, "Monthly":12, "4-weekly":13 };
  const periods = freqPeriods[freq] || 12;

  // Scale annual thresholds down to one period
  const periodAllowance = (() => {
    if (taxCode === "BR" || taxCode === "0T") return 0;
    if (taxCode === "NT") return periodGross; // no tax
    if (taxCode === "D0" || taxCode === "D1") return 0;
    if (taxCode && taxCode.startsWith("K")) return -((parseInt(taxCode.slice(1))||0)*10) / periods;
    const num = parseInt(taxCode) || Math.round(R.personalAllowance / 10);
    return (num * 10) / periods;
  })();

  const pensionAmt = periodGross * ((parseFloat(pensionPct)||0) / 100);
  const taxableInPeriod = Math.max(0, periodGross - pensionAmt - periodAllowance);

  let incomeTax = 0;
  if (taxCode === "D0") {
    incomeTax = periodGross * R.higherRate;
  } else if (taxCode === "D1") {
    incomeTax = periodGross * R.additionalRate;
  } else if (taxableInPeriod > 0) {
    // Period-scaled tax bands
    const basicTop   = (R.basicRateCeiling  - R.personalAllowance) / periods;
    const higherTop  = (R.higherRateCeiling - R.personalAllowance) / periods;
    const basicBand  = Math.min(taxableInPeriod, basicTop);
    const higherBand = Math.min(Math.max(taxableInPeriod - basicTop, 0), higherTop - basicTop);
    const addlBand   = Math.max(taxableInPeriod - higherTop, 0);
    incomeTax = basicBand * R.basicRate + higherBand * R.higherRate + addlBand * R.additionalRate;
  }

  // NI on period earnings using period-scaled thresholds
  let niAmt = 0;
  if (!niCategory || !niCategory.startsWith("C")) {
    const niPT  = R.niPrimaryThreshold / periods;
    const niUEL = R.niUpperEarningsLimit / periods;
    if (periodGross > niPT) {
      const mainRate = niCategory && niCategory.startsWith("B") ? R.niMainRateCatB : R.niMainRateCatA;
      const mainBand = Math.min(periodGross, niUEL) - niPT;
      const addlBand = Math.max(periodGross - niUEL, 0);
      niAmt = mainBand * mainRate + addlBand * R.niAdditionalRate;
    }
  }

  // Student loan on period earnings using period-scaled threshold
  let slAmt = 0;
  if (studentLoan && studentLoan !== "None") {
    const entry = R.studentLoan[studentLoan];
    if (entry) slAmt = Math.max(0, periodGross - entry.threshold / periods) * entry.rate;
  }

  const otherAmt = (otherMonthly || 0) * (12 / periods); // scale monthly other deductions
  const net = Math.max(0, periodGross - incomeTax - niAmt - pensionAmt - slAmt - otherAmt);
  return { gross: periodGross, incomeTax, ni: niAmt, pension: pensionAmt, studentLoanAmt: slAmt, otherAmt, net };
};

// ─── Net Pay View ─────────────────────────────────────────────────────────────
const NetPayView = ({who, agencies, shifts, payDetails, prefs, T, year, month, mode}) => {
  const RBG  = T ? T.card : BG2;
  const RTXT = T ? T.text : TEXT;
  const RTXT2= T ? T.text2 : TEXT2;
  const RTXT3= T ? T.sectionLabel : TEXT3;

  const details = payDetails || [];
  if (!details.length || !agencies.length) return null;
  const weekStartDay = (prefs && prefs.weekStartDay) || 1;

  // Check if any pay details have been configured (non-default)
  const hasDetails = details.some(d => d.taxCode && d.frequency);
  if (!hasDetails) return null;

  // Calculate gross for selected period
  const periodGross = agencies.map(ag => {
    const pd = details.find(d => d.agencyId === ag.id) || {};
    const startDay = parseInt(pd.payPeriodStart) || 1;
    const isMonthly = (pd.frequency === "Monthly" || pd.frequency === "4-weekly");
    const useCustomPeriod = isMonthly && startDay !== 1 && mode !== "yearly";

    let periodStart = null, periodEnd = null, periodLabel = null;
    if (mode !== "yearly") {
      const anchor = `${year}-${String(month+1).padStart(2,"0")}-15`;
      if (useCustomPeriod) {
        // Custom monthly period (e.g. 21st–20th)
        const cp = getCustomPeriod(anchor, startDay);
        periodStart = cp.start; periodEnd = cp.end;
        periodLabel = fmtPeriodLabel(periodStart, periodEnd);
      } else if (isMonthly) {
        // Standard monthly: 1st–last day of month
        const daysInMon = getDaysInMonth(year, month);
        periodStart = `${year}-${String(month+1).padStart(2,"0")}-01`;
        periodEnd = `${year}-${String(month+1).padStart(2,"0")}-${String(daysInMon).padStart(2,"0")}`;
        periodLabel = fmtPeriodLabel(periodStart, periodEnd);
      } else if (pd.frequency === "Weekly" || pd.frequency === "Fortnightly") {
        // Weekly: show the week that contains the 15th of the selected month
        const wsd = weekStartDay || 1;
        const wk = getWeekKey(anchor, wsd);
        const wkDates = getWeekDates(wk);
        const wkStart = wkDates[0], wkEnd = wkDates[6];
        if (pd.frequency === "Fortnightly") {
          // Show 2-week range
          const endD = new Date(wkEnd+"T00:00:00"); endD.setDate(endD.getDate()+7);
          const y2=endD.getFullYear(), m2=String(endD.getMonth()+1).padStart(2,"0"), d2=String(endD.getDate()).padStart(2,"0");
          periodLabel = fmtPeriodLabel(wkStart, `${y2}-${m2}-${d2}`);
        } else {
          periodLabel = fmtPeriodLabel(wkStart, wkEnd);
        }
      }
    }

    const agShifts = Object.entries(shifts).filter(([k]) => {
      const [date, aid] = k.split("_");
      if (aid !== ag.id) return false;
      if (mode === "yearly") { return new Date(date+"T00:00:00").getFullYear() === year; }
      if (useCustomPeriod) { return date >= periodStart && date <= periodEnd; }
      const d = new Date(date + "T00:00:00");
      return d.getFullYear() === year && d.getMonth() === month;
    });
    const gross = agShifts.reduce((s, [, sh]) => isPaid(sh) ? s + shiftPay(sh, ag.rate) : s, 0);
    return { ag, gross, pd, periodLabel, startDay };
  }).filter(x => x.gross > 0);

  if (!periodGross.length) return null;

  const freqPeriods = { "Weekly": 52, "Fortnightly": 26, "Monthly": 12, "4-weekly": 13 };

  return React.createElement("div", { style: { marginTop: 14 } },
    React.createElement("div", { style: { fontSize: 11, fontWeight: 700, color: RTXT3, textTransform: "uppercase", letterSpacing: "0.08em", fontFamily: "'DM Sans',sans-serif", marginBottom: 8 } }, "💷 Estimated Net Pay"),
    periodGross.map(({ ag, gross, pd, periodLabel }) => {
      const freq = pd.frequency || "Monthly";
      const periods = freqPeriods[freq] || 12;
      // For yearly mode, gross is already the full-year sum — use annual thresholds via calcUKNetPay.
      // For period mode, gross is one period's actual earnings — use per-period thresholds.
      let result;
      if (mode === "yearly") {
        result = calcUKNetPay(gross, pd.taxCode || "1257L", pd.niCategory || "A – Standard", pd.studentLoan || "None", pd.pension || 0, parseFloat(pd.otherDeductions) || 0, pd.taxYear);
      } else {
        result = calcUKNetPayFromPeriodGross(gross, pd.taxCode || "1257L", pd.niCategory || "A – Standard", pd.studentLoan || "None", pd.pension || 0, parseFloat(pd.otherDeductions) || 0, pd.taxYear, freq);
      }
      const periodNet = result.net;
      const periodTax = result.incomeTax;
      const periodNI = result.ni;
      const periodPen = result.pension;
      const periodSL = result.studentLoanAmt;
      const takeHomeRate = gross > 0 ? (periodNet / gross * 100) : 0;

      return React.createElement("div", { key: ag.id, style: { background: RBG, borderRadius: 14, padding: "14px", border: `1px solid ${ag.color}33`, marginBottom: 10 } },
        React.createElement("div", { style: { marginBottom: 10 } },
          React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
            React.createElement("span", { style: { fontSize: 12, fontWeight: 800, color: ag.color, fontFamily: "'DM Sans',sans-serif" } }, ag.name),
            React.createElement("span", { style: { fontSize: 10, color: RTXT3, fontWeight: 600, fontFamily: "'DM Sans',sans-serif" } }, freq + " · " + (pd.taxCode || "1257L"))
          ),
          periodLabel && React.createElement("div", { style: { fontSize: 10, color: RTXT3, fontFamily: "'DM Sans',sans-serif", marginTop: 2 } }, "📅 " + periodLabel)
        ),
        // Gross → Net waterfall
        [
          ["Gross Pay", gross, ag.color, false],
          periodTax > 0 && ["Income Tax", -periodTax, RED, true],
          periodNI > 0 && ["National Insurance", -periodNI, ORANGE, true],
          periodPen > 0 && ["Pension (" + (pd.pension || 0) + "%)", -periodPen, PURPLE, true],
          periodSL > 0 && ["Student Loan", -periodSL, "#e0bc55", true],
          (parseFloat(pd.otherDeductions) || 0) > 0 && ["Other Deductions", -(parseFloat(pd.otherDeductions) || 0) * (periodsInSelection / 12), TEXT3, true],
        ].filter(Boolean).map(([label, amount, color, isDed]) =>
          React.createElement("div", { key: label, style: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 0", borderBottom: `1px solid ${color}18` } },
            React.createElement("span", { style: { fontSize: 12, color: isDed ? RTXT3 : RTXT2, fontFamily: "'DM Sans',sans-serif" } }, isDed ? "  − " + label : label),
            React.createElement("span", { style: { fontSize: 13, fontWeight: 700, color, fontFamily: "'DM Mono',monospace" } }, fmtGBP(Math.abs(amount)))
          )
        ),
        // Net take-home
        React.createElement("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 8, padding: "8px 10px", background: `${ag.color}12`, borderRadius: 8 } },
          React.createElement("div", null,
            React.createElement("div", { style: { fontSize: 12, fontWeight: 800, color: RTXT2, fontFamily: "'DM Sans',sans-serif" } }, "Est. Take-Home"),
            React.createElement("div", { style: { fontSize: 10, color: RTXT3, fontFamily: "'DM Sans',sans-serif" } }, Math.round(takeHomeRate) + "% of gross · " + (mode === "yearly" ? "annual" : periodLabel || MONTHS[month]))
          ),
          React.createElement("div", { style: { fontSize: 20, fontWeight: 800, color: ag.color, fontFamily: "'DM Mono',monospace" } }, fmtGBP(periodNet))
        ),
        // Annual projection line
        React.createElement("div", { style: { marginTop: 6, fontSize: 10, color: RTXT3, fontFamily: "'DM Sans',sans-serif", textAlign: "right" } },
          mode !== "yearly" && "Annual projection: " + fmtGBP(result.net)
        )
      );
    }),
    // Combined annual summary (only shown in yearly mode when there are 2+ agencies with data)
    mode === "yearly" && periodGross.length >= 2 && (()=>{
      // In yearly mode, gross is already the annual total for each agency.
      // calcUKNetPay expects annual gross — correct to pass it directly.
      const combinedGross = periodGross.reduce((s,{gross})=>s+gross,0);
      const agResults = periodGross.map(({gross,pd})=>
        calcUKNetPay(gross, pd.taxCode||"1257L", pd.niCategory||"A – Standard", pd.studentLoan||"None", pd.pension||0, parseFloat(pd.otherDeductions)||0, pd.taxYear)
      );
      const combinedTakeHome = agResults.reduce((s,r)=>s+r.net,0);
      const combinedTax      = agResults.reduce((s,r)=>s+r.incomeTax,0);
      const combinedNI       = agResults.reduce((s,r)=>s+r.ni,0);
      const takeRate = combinedGross > 0 ? Math.round(combinedTakeHome/combinedGross*100) : 0;
      return React.createElement("div",{style:{background:RBG,borderRadius:14,padding:"14px",border:`2px solid ${RTXT3}44`,marginBottom:10,marginTop:4}},
        React.createElement("div",{style:{fontSize:12,fontWeight:800,color:RTXT2,fontFamily:"'DM Sans',sans-serif",marginBottom:10}},
          "🏦 Combined Annual · All Workplaces"
        ),
        [
          ["Total Gross", annualGrossAll, RTXT2, false],
          combinedTax>0&&["Income Tax (total)", -combinedTax, RED, true],
          combinedNI>0&&["National Insurance (total)", -combinedNI, ORANGE, true],
        ].filter(Boolean).map(([label,amount,color,isDed])=>
          React.createElement("div",{key:label,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:`1px solid ${color}18`}},
            React.createElement("span",{style:{fontSize:12,color:isDed?RTXT3:RTXT2,fontFamily:"'DM Sans',sans-serif"}},isDed?"  − "+label:label),
            React.createElement("span",{style:{fontSize:13,fontWeight:700,color,fontFamily:"'DM Mono',monospace"}},fmtGBP(Math.abs(amount)))
          )
        ),
        React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8,padding:"10px 12px",background:`${RTXT3}12`,borderRadius:8}},
          React.createElement("div",null,
            React.createElement("div",{style:{fontSize:12,fontWeight:800,color:RTXT2,fontFamily:"'DM Sans',sans-serif"}},"Est. Annual Take-Home"),
            React.createElement("div",{style:{fontSize:10,color:RTXT3,fontFamily:"'DM Sans',sans-serif"}},takeRate+"% of gross · all workplaces combined")
          ),
          React.createElement("div",{style:{fontSize:22,fontWeight:800,color:RTXT2,fontFamily:"'DM Mono',monospace"}},fmtGBP(combinedTakeHome))
        )
      );
    })()
  );
};

// ─── PDF Export ───────────────────────────────────────────────────────────────
const exportPDF = (year, month, who, agencies, shifts, payDetails, myName, partnerName, prefs) => {
  const name = who === "partner" ? (partnerName || "Person 2") : (myName || "Person 1");
  const monthStr = MONTHS[month] + " " + year;
  const daysInMonth = getDaysInMonth(year, month);
  const details = payDetails || [];
  const freqPeriods = { "Weekly": 52, "Fortnightly": 26, "Monthly": 12, "4-weekly": 13 };

  // Collect all shifts for the month
  const rows = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const dayDate = new Date(dateStr + "T00:00:00");
    const dayLabel = dayDate.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
    agencies.forEach(ag => {
      const sh = shifts[`${dateStr}_${ag.id}`];
      if (!sh) return;
      rows.push({ dateStr, dayLabel, ag, sh });
    });
  }

  // Total gross
  const agTotals = agencies.map(ag => {
    const agRows = rows.filter(r => r.ag.id === ag.id && isPaid(r.sh));
    const gross = agRows.reduce((s, r) => s + shiftPay(r.sh, ag.rate), 0);
    const hours = agRows.reduce((s, r) => s + shiftHours(r.sh), 0);
    const pd = details.find(d => d.agencyId === ag.id) || {};
    let netSection = "";
    if (pd.taxCode) {
      // Use per-period thresholds on actual gross (not annualised)
      const freq = pd.frequency || "Monthly";
      const result = calcUKNetPayFromPeriodGross(gross, pd.taxCode, pd.niCategory || "A – Standard", pd.studentLoan || "None", pd.pension || 0, parseFloat(pd.otherDeductions) || 0, pd.taxYear, freq);
      netSection = `
        <tr class="net-row"><td colspan="4"></td><td>Income Tax</td><td class="amt ded">−${fmtGBP(result.incomeTax)}</td></tr>
        <tr class="net-row"><td colspan="4"></td><td>National Insurance</td><td class="amt ded">−${fmtGBP(result.ni)}</td></tr>
        ${result.pension > 0 ? `<tr class="net-row"><td colspan="4"></td><td>Pension (${pd.pension}%)</td><td class="amt ded">−${fmtGBP(result.pension)}</td></tr>` : ""}
        ${result.studentLoanAmt > 0 ? `<tr class="net-row"><td colspan="4"></td><td>Student Loan</td><td class="amt ded">−${fmtGBP(result.studentLoanAmt)}</td></tr>` : ""}
        <tr class="net-total"><td colspan="4"></td><td><strong>Est. Take-Home</strong></td><td class="amt net"><strong>${fmtGBP(result.net)}</strong></td></tr>
      `;
    }
    return { ag, gross, hours, days: agRows.length, pd, netSection };
  });

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"/>
  <title>Shifto – ${name} – ${monthStr}</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11pt; color: #111; margin: 20px 28px; }
    h1 { font-size: 20pt; color: #1a3a1a; margin-bottom: 2px; }
    .sub { color: #555; font-size: 10pt; margin-bottom: 18px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th { background: #1a3a1a; color: #fff; padding: 7px 10px; text-align: left; font-size: 9.5pt; }
    td { padding: 5px 10px; border-bottom: 1px solid #e5e5e5; font-size: 10pt; vertical-align: top; }
    tr:nth-child(even) td { background: #f9f9f9; }
    .amt { text-align: right; font-family: monospace; }
    .workplace-header { background: #f7efd6; font-weight: bold; color: #1a2744; }
    .gross-row td { background: #faf5e6; }
    .net-row td { background: #fff8e8; color: #555; font-size: 9.5pt; }
    .net-total td { background: #f3e9cc; font-size: 11pt; }
    .ded { color: #c0392b; }
    .net { color: #8a6d1e; }
    .tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 8.5pt; }
    .working { background: #f3e9cc; color: #8a6d1e; }
    .off { background: #fde8e8; color: #c0392b; }
    .sleepover { background: #e8e0ff; color: #5b3d9e; }
    @media print {
      body { margin: 10px 14px; }
      button { display: none; }
    }
    .print-btn { background: #1a3a1a; color: #fff; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 11pt; margin-bottom: 14px; }
  </style></head><body>
  <button class="print-btn" onclick="window.print()">🖨 Print / Save as PDF</button>
  <h1>Shifto · Shift Report</h1>
  <div class="sub">${name} · ${monthStr} · Generated ${new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}</div>
  <table>
    <thead><tr><th>Date</th><th>Day</th><th>Workplace</th><th>Hours</th><th>Detail</th><th>Gross</th></tr></thead>
    <tbody>
    ${rows.map(({ dayLabel, ag, sh }) => `
      <tr>
        <td>${dayLabel}</td>
        <td><span class="tag ${sh.working ? "working" : "off"}">${sh.working ? "Working" : isPaidHoliday(sh) ? "Holiday (paid)" : sh.isHoliday ? "Holiday" : "Day Off"}</span></td>
        <td>${ag.name}</td>
        <td>${isPaid(sh) ? fmtHours(shiftHours(sh)) : "–"}</td>
        <td>${sh.working ? (sh.startTime || "") + (sh.endTime ? " – " + sh.endTime : "") : ""}${sh.hasSleepover ? ' <span class="tag sleepover">💤 Sleepover</span>' : ""}${sh.note ? '<br><em style="color:#777;font-size:9pt;">' + sh.note + "</em>" : ""}</td>
        <td class="amt">${isPaid(sh) ? fmtGBP(shiftPay(sh, ag.rate)) : "–"}</td>
      </tr>`).join("")}
    ${agTotals.map(({ ag, gross, hours, days, netSection }) => `
      <tr class="gross-row">

        <td>${fmtHours(hours)}</td>
        <td>Gross Pay</td>
        <td class="amt"><strong>${fmtGBP(gross)}</strong></td>
      </tr>
      ${netSection}
    `).join("")}
    </tbody>
  </table>
  <div style="font-size:9pt;color:#888;margin-top:10px;">⚠ Net pay estimates are based on 2024/25 UK tax rates. For accurate figures consult your payslip or a qualified accountant.</div>
  </body></html>`;

  // Use blob URL — window.open("","_blank") is blocked on mobile browsers
  try {
    const blob = new Blob([html], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Shifto_${name.replace(/\s+/g,"_")}_${MONTHS[month]}_${year}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 10000);
  } catch(e) {
    // Fallback: try popup
    const win = window.open("", "_blank");
    if (win) { win.document.write(html); win.document.close(); }
  }
};

  const showBackupReminder = daysSinceSync===null||daysSinceSync>=7;

  const exportData = (emailBackup=false) => {
    const data=getAllData(); const json=JSON.stringify(data,null,2);
    const n2=new Date(); const date=`${n2.getFullYear()}-${String(n2.getMonth()+1).padStart(2,'0')}-${String(n2.getDate()).padStart(2,'0')}`;
    if (emailBackup) {
      const sub=encodeURIComponent(`Shifto Backup – ${date}`);
      const body=encodeURIComponent(`Shifto backup from ${date}\n\n---BEGIN BACKUP---\n${json}\n---END BACKUP---`);
      window.location.href=`mailto:?subject=${sub}&body=${body}`;
    } else {
      const url=URL.createObjectURL(new Blob([json],{type:"application/json"}));
      const a=document.createElement("a"); a.href=url; a.download=`shifto-backup-${date}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),10000);
    }
  };

  const exportCSV = () => {
    const freqPeriods={"Weekly":52,"Fortnightly":26,"Monthly":12,"4-weekly":13};
    const rows=[["Date","Day","Person","Workplace","Working","Start","End","Hours","Gross Pay","Est. Tax","Est. NI","Est. Pension","Est. Net Pay","Sleepover","Note"]];
    const agMap={};
    [...myAgencies,...partnerAgencies].forEach(ag=>{agMap[ag.id]=ag;});
    const allKeys=Object.keys({...myShifts,...partnerShifts}).sort();
    allKeys.forEach(k=>{
      const [date,aid]=k.split("_");
      const isMe=!!myShifts[k];

function App() {
  // Run migration on first load
  useEffect(()=>{ migrateData(); },[]);

  const [myAgencies,setMyAgencies] = useState(()=>load("spt_agencies",DEFAULT_MY_AGENCIES));

  const [partnerShifts,setPartnerShifts] = useState(()=>load("spt_partner_shifts",{}));
  const [paidLog,setPaidLog] = useState(()=>load("spt_paid_log",{}));
  const [prefs,setPrefs] = useState(()=>{
    const p=load("spt_prefs",null);
    if (!p) return DEFAULT_PREFS;
    return {...DEFAULT_PREFS,...p,weekStartDay:typeof p.weekStartDay==="number"?p.weekStartDay:DEFAULT_PREFS.weekStartDay};
  });
  const [tab,setTab] = useState("week");
  const TABS_LIST = useMemo(()=>[
    {id:"week",icon:"📋",label:prefs.myName||"Person 1"},
    {id:"partner",icon:"👫",label:prefs.partnerName||"Person 2"},
    {id:"reports",icon:"📊",label:"Reports"},
    {id:"payslip",icon:"💷",label:"Payslip"},
    {id:"settings",icon:"⚙️",label:"Settings"}
  ],[prefs.myName,prefs.partnerName]);

  useEffect(()=>{ save("spt_agencies",myAgencies); },[myAgencies]);
  useEffect(()=>{ save("spt_shifts",myShifts); triggerAutoSync(); },[myShifts]);
  useEffect(()=>{ save("spt_partner_agencies",partnerAgencies); },[partnerAgencies]);
  useEffect(()=>{ save("spt_partner_shifts",partnerShifts); triggerAutoSync(); },[partnerShifts]);
  useEffect(()=>{ save("spt_prefs",prefs); triggerAutoSync(); },[prefs]);
  useEffect(()=>{ save("spt_paid_log",paidLog); },[paidLog]);

  // ── One-time cleanup: remove past rota shifts wrongly back-filled by a previous bug ──
  // Runs once on mount. Strips any _rota shift (not manually overridden) before today.
  useEffect(()=>{
    const todayStr = localDate();
    setPartnerShifts(prev=>{
      const cleaned = {...prev};
      let changed = false;
      Object.keys(cleaned).forEach(k=>{
        const [date] = k.split("_");
        if (date < todayStr && cleaned[k]?._rota && !cleaned[k]?._manual) {
          delete cleaned[k];
          changed = true;
        }
      });
      return changed ? cleaned : prev; // avoid re-render if nothing changed
    });
  },[]); // eslint-disable-line react-hooks/exhaustive-deps

  // ── Timesheet reminder scheduler — check daily on app open ──
  useEffect(()=>{
    if (typeof Notification==="undefined" || Notification.permission!=="granted") return;
    const reminders = prefs.timesheetReminders||[];
    if (!reminders.length) return;
    const today = localDate();
    const todayDow = new Date(today+"T00:00:00").getDay(); // 0=Sun
    const todayDom = new Date(today+"T00:00:00").getDate();
    const lastShown = load("spt_reminder_shown","");
    if (lastShown===today) return; // already fired today
    const fired = reminders.filter(r=>{
      if (r.freq==="weekly") return todayDow===(r.dayOfWeek||0);
      if (r.freq==="monthly") return todayDom===(r.dayOfMonth||1);
      return false;
    });
    if (fired.length>0) {
      save("spt_reminder_shown",today);
      fired.forEach(r=>{
        setTimeout(()=>{
          try {
            new Notification("⏰ Timesheet Reminder — Shifto",{
              body:`Don't forget to send your timesheet for ${r.agName}!`,
            });
          } catch(_){}
        }, 800);
      });
    }
  },[prefs.timesheetReminders]);

  // ── Firebase live sync ──
  const [fbStatus, setFbStatus] = useState("idle"); // idle | syncing | synced | error
  useEffect(()=>{
    registerFbOnRestore(data => {
      if (data.myAgencies) setMyAgencies(data.myAgencies);
      if (data.myShifts) setMyShifts(data.myShifts);
      if (data.partnerAgencies) setPartnerAgencies(data.partnerAgencies);
      if (data.partnerShifts) setPartnerShifts(data.partnerShifts);
      if (data.prefs) setPrefs(p=>({...DEFAULT_PREFS,...data.prefs}));
      if (data.paidLog) setPaidLog(data.paidLog);
      setFbStatus("synced");
    });
    initFirebaseSync();
  },[]);

  const fbSyncData = useMemo(()=>({
    myAgencies, myShifts, partnerAgencies, partnerShifts, prefs
  }),[myAgencies, myShifts, partnerAgencies, partnerShifts, prefs]);

  const isMounted = useRef(false);
  useEffect(()=>{
    if (!isMounted.current) { isMounted.current=true; return; }
    setFbStatus("syncing");
    fbPushDebounced({...fbSyncData, _syncedAt: new Date().toISOString()});
    const t = setTimeout(()=>setFbStatus("synced"), 2500);
    return ()=>clearTimeout(t);
  },[fbSyncData]);

  // Auto-sync setup
  const autoSyncTimer = useRef(null);
  const getAllData = useCallback(()=>({
    version:DATA_VERSION, exportedAt:new Date().toISOString(),
    myAgencies, myShifts, partnerAgencies, partnerShifts, prefs, paidLog,
    agencies:myAgencies, shifts:myShifts
  }),[myAgencies,myShifts,partnerAgencies,partnerShifts,prefs,paidLog]);

  useEffect(()=>{
    registerAutoSync(()=>{
      clearTimeout(autoSyncTimer.current);
      autoSyncTimer.current=setTimeout(async()=>{
        if (!load("spt_auto_sync",false)) return;
        try { await gDrive.save(getAllData()); save("spt_last_sync",Date.now()); } catch {}
      },3000);
    });
  },[getAllData]);

  const onRestore = data => {
    if (data.myAgencies) setMyAgencies(data.myAgencies); else if (data.agencies) setMyAgencies(data.agencies);
    if (data.myShifts) setMyShifts(data.myShifts); else if (data.shifts) setMyShifts(data.shifts);
    if (data.partnerAgencies) setPartnerAgencies(data.partnerAgencies);
    if (data.partnerShifts) setPartnerShifts(data.partnerShifts);
    if (data.prefs) setPrefs({...DEFAULT_PREFS,...data.prefs});
    if (data.paidLog) setPaidLog(data.paidLog);
  };

  const onApplyRota = rotaConfig => {
    setPartnerShifts(prev=>{
      // One-time cleanup: remove any wrongly-filled past rota shifts
      // (shifts with _rota:true on dates before today that were filled by a previous bug)
      const todayStr = localDate();
      const cleaned = {...prev};
      Object.keys(cleaned).forEach(k=>{
        const [date] = k.split("_");
        if (date < todayStr && cleaned[k]?._rota && !cleaned[k]?._manual) {
          delete cleaned[k];
        }
      });
      return applyRota(rotaConfig, partnerAgencies, cleaned);
    });
  };

  const PARTNER_PRESETS = [{label:"7–7",start:"07:00",end:"19:00"},{label:"7–1",start:"07:00",end:"13:00"}];
  const headerHeight = "calc(env(safe-area-inset-top, 0px) + 110px)";

  const isDark = (prefs.theme||"dark")==="dark";
  const T = {
    // Backgrounds — light: warm cream; dark: deep navy
    bg:         isDark ? "#1a2744" : "#f5f0e8",
    bg2:        isDark ? "#243460" : "#faf6ee",
    bg3:        isDark ? "#2d3f74" : "#ede6d8",
    // Borders
    border:     isDark ? "#3a4f80" : "#c9a84340",
    border2:    isDark ? "#4a5f90" : "#c9a84360",
    // Text — navy in light for max contrast
    text:       isDark ? "#f5f0e8" : "#1a2744",
    text2:      isDark ? "#d4c9b0" : "#2d3f74",
    text3:      isDark ? "#9a8e70" : "#6a7a9a",
    // Cards — clean white so they stand off the cream bg
    card:       isDark ? "#243460" : "#ffffff",
    cardBorder: isDark ? "#3a4f80" : "#e8e0cc",
    // Section backgrounds
    section:    isDark ? "#243460" : "#ffffff",
    sectionBg:  isDark ? "#1a2744" : "#f5f0e8",
    // Gold highlight — used for active pills, selected state, badges
    yellow:     "#c9a843",
    yellowText: isDark ? "#1a2744" : "#1a2744",
    // Header — always navy regardless of theme
    header:     isDark ? "rgba(26,39,68,0.97)" : "rgba(26,39,68,1)",
    headerBorder: isDark ? "#3a4f80" : "#243460",
    // Gold accent throughout
    blue:       "#c9a843",
    blueText:   "#c9a843",
    blueLight:  "rgba(201,168,67,0.12)",
    blueBorder: "rgba(201,168,67,0.35)",
    // Section label
    sectionLabel: isDark ? "#9a8e70" : "#6a7a9a",
    // Inputs
    input:      isDark ? "#2d3f74" : "#ffffff",
    inputBorder:isDark ? "#4a5f90" : "#c9a84360",
    // Nav text in header — always light since header is always navy
    navText:    "#f5f0e8",
    navTextDim: "rgba(245,240,232,0.45)",
  };

  const onThemeToggle = () => setPrefs(p=>({...p,theme:(p.theme||"dark")==="dark"?"light":"dark"}));

  useEffect(()=>{
    document.body.style.background = "#1a2744"; // always navy so iOS safe areas are navy
    document.body.style.color = T.text;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = "#1a2744";
  },[T.bg,T.text]);

  return React.createElement(React.Fragment,null,
    React.createElement(ToastHost,{T}),
    React.createElement("style",null,`
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&family=DM+Mono:wght@400;500;700&display=swap');
      *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
      html,body{height:100%;background:${T.bg};color:${T.text};overflow-x:hidden;}
      input[type="time"]::-webkit-calendar-picker-indicator{filter:${isDark?"invert(0.35)":"invert(0.4) sepia(0.3)"};}
      input[type="date"]::-webkit-calendar-picker-indicator{filter:${isDark?"invert(0.35)":"invert(0.4) sepia(0.3)"};}
      select option{background:${T.bg2};color:${T.text};}
      ::-webkit-scrollbar{width:0;}
      #root{height:100%;}
      ${isDark?"":`
      .sx-light *:not(button):not(button *):not(.sx-dark):not(.sx-dark *){color:#1a2744 !important;}
      .sx-light .sx-card:not(.sx-dark *){background:#ffffff !important;border-color:#e8e0cc !important;}
      .sx-light input:not([type=checkbox]):not([type=radio]):not([type=range]):not(.sx-dark *),.sx-light textarea:not(.sx-dark *),.sx-light select:not(.sx-dark *){background-color:#ffffff !important;border-color:rgba(201,168,67,0.38) !important;}
      .sx-light button:not([data-keep]){background:#1a2744 !important;color:#c9a843 !important;border-color:#1a2744 !important;box-shadow:none !important;}
      .sx-light button:not([data-keep]) *{color:#c9a843 !important;}
      .sx-light button[data-on="false"],.sx-light button[data-on="false"] *{color:rgba(201,168,67,0.62) !important;}
      .sx-light button[data-on="true"]{box-shadow:inset 0 0 0 2px #c9a843 !important;}
      `}
    `),
    React.createElement("div",{style:{maxWidth:430,margin:"0 auto",minHeight:"100dvh",background:T.bg}},
      React.createElement(AppHeader,{appName:prefs.appName||"Shifto",myAgencies,partnerAgencies,tab,onTabChange:setTab,tabs:TABS_LIST,theme:prefs.theme||"dark",onThemeToggle,T,fbStatus}),
      React.createElement("div",{className:isDark?"":"sx-light",style:{position:"fixed",top:headerHeight,bottom:0,left:0,right:0,maxWidth:430,margin:"0 auto",display:"flex",flexDirection:"column",overflow:"hidden",background:T.bg,paddingTop:0}},
        tab==="week"&&React.createElement(WeeklyView,{
          key:prefs.weekStartDay,
          agencies:myAgencies,shifts:myShifts,setShifts:setMyShifts,
          weekStartDay:prefs.weekStartDay,accentColor:T.blue,
          partnerShifts,partnerAgencies,
          targetHours:prefs.weeklyTargetHours||0,
          theme:prefs.theme||"dark",
          payDetails:prefs.myPayDetails,
          summaryPeriod:prefs.summaryPeriod||"weekly",
          prefs,setPrefs
        }),
        tab==="partner"&&React.createElement(WeeklyView,{
          key:`p${prefs.weekStartDay}`,
          agencies:partnerAgencies,shifts:partnerShifts,setShifts:setPartnerShifts,
          weekStartDay:prefs.weekStartDay,accentColor:ORANGE,presets:PARTNER_PRESETS,
          partnerShifts:myShifts,partnerAgencies:myAgencies,
          isPartnerView:true,
          theme:prefs.theme||"dark",
          payDetails:prefs.partnerPayDetails,
          summaryPeriod:prefs.summaryPeriod||"weekly",
          prefs,setPrefs
        }),
        tab==="reports"&&React.createElement(ReportsView,{myAgencies,myShifts,setMyShifts,partnerAgencies,partnerShifts,setPartnerShifts,weekStartDay:prefs.weekStartDay,partnerName:prefs.partnerName,myName:prefs.myName||"Person 1",prefs,T,partnerPresets:PARTNER_PRESETS}),
        tab==="payslip"&&React.createElement(PayslipChecker,{myAgencies,myShifts,partnerAgencies,partnerShifts,prefs,setPrefs,T,paidLog,setPaidLog}),
        tab==="settings"&&React.createElement(SettingsView,{myAgencies,setMyAgencies,partnerAgencies,setPartnerAgencies,shifts:myShifts,setShifts:setMyShifts,partnerShifts,setPartnerShifts,prefs,setPrefs,getAllData,onRestore,onApplyRota,T,fbSyncStatus:fbStatus}),
        // Gold 1mm bottom bar on pages without the weekly summary footer
        tab!=="week"&&tab!=="partner"&&React.createElement("div",{style:{flexShrink:0,borderTop:"4px solid #c9a843",background:"#1a2744",height:"calc(env(safe-area-inset-bottom, 0px) + 10px)"}})
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
  </script>
</body>
</html>
