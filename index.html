// ─── Helpers ──────────────────────────────────────────────────────────────────
const toMins = t => { if (!t) return 0; const [h,m] = t.split(":").map(Number); return h*60+m; };
const toHours = m => Math.round(m/60*100)/100;
const fmtHours = h => {
  const hrs = Math.floor(h), mins = Math.round((h-hrs)*60);
  if (!hrs && !mins) return "0h";
  if (!hrs) return `${mins}m`;
  if (!mins) return `${hrs}h`;
  return `${hrs}h ${mins}m`;
};
const fmtGBP = n => new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP"}).format(n);
const dayName = d => new Date(d+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short"});
const localDate = (d=new Date()) => {
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
};
const addDays = (dateStr, n) => {
  const d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n);
  return localDate(d);
};
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEK_DAYS = [{v:1,l:"Mon"},{v:2,l:"Tue"},{v:3,l:"Wed"},{v:4,l:"Thu"},{v:5,l:"Fri"},{v:6,l:"Sat"},{v:0,l:"Sun"}];
const uuid = () => Math.random().toString(36).slice(2);
const getWeekKey = (date, wsd=1) => {
  const ds = typeof date==='string' && date.length===10 ? date+"T00:00:00" : date;
  const d = new Date(ds); d.setHours(0,0,0,0);
  const diff = (d.getDay()-wsd+7)%7; d.setDate(d.getDate()-diff);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
};
const getWeekDates = wk => Array.from({length:7},(_,i)=>{
  const d = new Date(wk+"T00:00:00"); d.setDate(d.getDate()+i);
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
});
const weekLabel = wk => {
  const s=new Date(wk+"T00:00:00"), e=new Date(wk+"T00:00:00"); e.setDate(e.getDate()+6);
  return `${s.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${e.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`;
};
const shiftHours = s => {
  if (!s||!s.working||!s.startTime||!s.endTime) return 0;
  let a=toMins(s.startTime), b=toMins(s.endTime);
  if (b<=a) b+=1440;
  return toHours(b-a);
};
const shiftPay = (s,rate) => shiftHours(s)*rate + (s&&s.hasSleepover ? s.sleepoversRate||60 : 0);
const getDaysInMonth = (y,m) => new Date(y,m+1,0).getDate();

// Get the custom pay period that contains a given date (for monthly pay with custom start day)
const getCustomPeriod = (dateStr, startDay) => {
  const d = new Date(dateStr+"T00:00:00");
  const day = d.getDate(), m = d.getMonth(), y = d.getFullYear();
  let pStart, pEnd;
  if (day >= startDay) {
    // period started this month
    pStart = new Date(y, m, startDay);
    pEnd = new Date(y, m+1, startDay-1);
  } else {
    // period started last month
    pStart = new Date(y, m-1, startDay);
    pEnd = new Date(y, m, startDay-1);
  }
  return { start: localDate(pStart), end: localDate(pEnd) };
};

// Get current custom period
const currentCustomPeriod = (startDay) => getCustomPeriod(localDate(), startDay);

// Format a period label e.g. "21 Sep – 20 Oct 2026"
const fmtPeriodLabel = (start, end) => {
  const s = new Date(start+"T00:00:00"), e = new Date(end+"T00:00:00");
  return s.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" – "+e.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
};
const load = (k,d) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):d; } catch { return d; } };
const save = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)); } catch {} };

// ─── Firebase Realtime Database sync ─────────────────────────────────────────
const FB_PATH = "shifto/shared";
let _fbPushFn = null;
let _fbOnRestoreFn = null;
let _fbIgnoreNext = false; // prevent echo-back loop

const registerFbPush = fn => { _fbPushFn = fn; };
const registerFbOnRestore = fn => { _fbOnRestoreFn = fn; };

const fbPush = data => {
  if (!_fbPushFn) return;
  _fbPushFn(data);
};

// Called once on app mount — sets up the live listener
const initFirebaseSync = (onRemoteData) => {
  try {
    const db = firebase.database();
    const ref = db.ref(FB_PATH);
    ref.on("value", snap => {
      if (_fbIgnoreNext) { _fbIgnoreNext = false; return; }
      const val = snap.val();
      if (!val) return;
      // Only apply if remote timestamp is newer than local
      const localTs = load("spt_fb_ts", 0);
      if (val._ts && val._ts > localTs) {
        save("spt_fb_ts", val._ts);
        if (_fbOnRestoreFn) _fbOnRestoreFn(val);
      }
    });
    return ref;
  } catch(e) { return null; }
};

let _fbPushTimer = null;
const fbPushDebounced = (data) => {
  clearTimeout(_fbPushTimer);
  _fbPushTimer = setTimeout(() => {
    try {
      const db = firebase.database();
      const ref = db.ref(FB_PATH);
      const payload = { ...data, _ts: Date.now() };
      _fbIgnoreNext = true;
      save("spt_fb_ts", payload._ts);
      ref.set(payload).catch(()=>{});
    } catch(e) {}
  }, 2000);
};

// ─── Data version migration ───────────────────────────────────────────────────
const migrateData = () => {
  const ver = load("spt_data_version", 1);
  if (ver < 2) {
    // v1→v2: rename Agency N → Workplace N in agency names
    const agencies = load("spt_agencies", null);
    if (agencies) {
      const updated = agencies.map(ag=>({...ag, name:ag.name.replace(/^Agency (\d+)$/, "Workplace $1")}));
      save("spt_agencies", updated);
    }
  }
  if (ver < 3) {
    // v2→v3: ensure prefs has rotaConfig
    const prefs = load("spt_prefs", null);
    if (prefs && !prefs.rotaConfig) {
      save("spt_prefs", {...prefs, rotaConfig:{enabled:false,startDate:"",weekADays:[],weekBDays:[]}});
    }
  }
  save("spt_data_version", DATA_VERSION);
};

// ─── Rolling rota helpers ─────────────────────────────────────────────────────
// Returns "A" or "B" for a given date based on rota start date
const getRotaWeek = (dateStr, startDate) => {
  if (!startDate) return "A";
  const start = new Date(startDate+"T00:00:00");
  const target = new Date(dateStr+"T00:00:00");
  const diffMs = target - start;
  const diffDays = Math.floor(diffMs / 86400000);
  const diffWeeks = Math.floor(diffDays / 7);
  return diffWeeks % 2 === 0 ? "A" : "B";
};

// Auto-populate partner shifts for the entire year based on rota config
const applyRota = (rotaConfig, partnerAgencies, existingShifts) => {
  if (!rotaConfig.enabled || !rotaConfig.startDate || !partnerAgencies.length) return existingShifts;
  const newShifts = {...existingShifts};
  const defaultAgId = partnerAgencies[0].id;
  const today = new Date();
  const yearStart = new Date(today.getFullYear(), 0, 1);
  const yearEnd = new Date(today.getFullYear() + 1, 11, 31);
  let cur = new Date(yearStart);
  while (cur <= yearEnd) {
    const dateStr = localDate(cur);
    const dayOfWeek = cur.getDay(); // 0=Sun, 1=Mon...
    const week = getRotaWeek(dateStr, rotaConfig.startDate);
    const pattern = week === "A" ? (rotaConfig.weekADays||[]) : (rotaConfig.weekBDays||[]);
    const dayPattern = pattern.find(p => p.dayOfWeek === dayOfWeek);
    const key = `${dateStr}_${defaultAgId}`;
    // Only auto-fill if not manually overridden (manual override has _manual flag)
    if (!existingShifts[key] || !existingShifts[key]._manual) {
      if (dayPattern) {
        newShifts[key] = {
          id: uuid(), agencyId: defaultAgId, working: true,
          startTime: dayPattern.startTime || "07:00",
          endTime: dayPattern.endTime || "19:00",
          note: "", hasSleepover: false, sleepoversRate: 60,
          slpStart: "", slpEnd: "", continuesNext: false,
          _rota: true
        };
      } else {
        // Not a working day per rota — only clear if it was a rota shift
        if (existingShifts[key] && existingShifts[key]._rota) {
          delete newShifts[key];
        }
      }
    }
    cur.setDate(cur.getDate() + 1);
  }
  return newShifts;
};

// ─── Google Drive ─────────────────────────────────────────────────────────────
const CLIENT_ID = "172131256633-pl22eugc1igakdr77f2rfk92chc4d8qb.apps.googleusercontent.com";
const gDrive = {
  _token:null, _signedIn:false, _email:null,
  async token(silent=false) {
    if (this._token && this._token.exp>Date.now()) return this._token.tok;
    if (!window.google?.accounts?.oauth2) throw new Error("Google sign-in script not loaded. Check your internet connection and reload.");
    return new Promise((res,rej)=>{
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id:CLIENT_ID,
        scope:"https://www.googleapis.com/auth/drive.appdata",
        callback: r=>{
          if (r.error) return rej(r.error);
          this._token={tok:r.access_token,exp:Date.now()+(r.expires_in-60)*1000};
          this._signedIn=true; res(r.access_token);
        }
      });
      client.requestAccessToken({prompt:silent?"none":""});
    });
  },
  async save(data) {
    const t=await this.token(), j=JSON.stringify(data);
    const q=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'shifto-backup.json'&fields=files(id)",{headers:{Authorization:"Bearer "+t}});
    const found=await q.json(), id=found.files?.[0]?.id;

    const form=new FormData();
    form.append("metadata",new Blob([JSON.stringify(meta)],{type:"application/json"}));
    form.append("file",new Blob([j],{type:"application/json"}));
    const r=await fetch(id?`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=multipart`:"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
      {method:id?"PATCH":"POST",headers:{Authorization:"Bearer "+t},body:form});
    if (!r.ok) throw new Error("Save failed");
  },
  async load() {
    const t=await this.token();
    const q=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D'shifto-backup.json'&fields=files(id)",{headers:{Authorization:"Bearer "+t}});

    if (!id) return null;
    const r=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:{Authorization:"Bearer "+t}});
    if (!r.ok) throw new Error("Load failed");
    return r.json();
  }
};

const TIME_SLOTS = Array.from({length:48},(_,i)=>{
  const h=Math.floor(i/2), m=i%2===0?"00":"30";

const TimeField = ({label,value,onChange,P}) => {
  const [mode,setMode] = useState("select");

  const googleReady = !!(window.google?.accounts?.oauth2);

  const signIn = async () => {
    setStatus("signing-in"); setMsg("");
    try {
      await gDrive.token(false);
      // Try to get user info
      try {
        const t = gDrive._token?.tok;
        const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo",{headers:{Authorization:"Bearer "+t}});
        const info = await res.json();
        gDrive._email = info.email;
        setUserEmail(info.email);
      } catch(e){}
      setSignedIn(true); gDrive._signedIn=true;
      setStatus("idle"); setMsg("Signed in ✓");
    } catch(e) { setStatus("err"); setMsg("Sign-in failed: "+e.message); }
  };

  const signOut = () => {
    gDrive._token=null; gDrive._signedIn=false; gDrive._email=null;
    setSignedIn(false); setUserEmail(null); setMsg("");setStatus("idle");
  };

  const doSave = async () => {
    setStatus("saving"); setMsg("");
    try { await gDrive.save(getData()); save("spt_last_sync",Date.now()); setStatus("ok"); setMsg("Saved to Drive ✓"); }
    catch(e) { setStatus("err"); setMsg("Failed: "+e.message); }
  };
  const doLoad = async () => {
    setStatus("loading"); setMsg("");
    try {

      onRestore(d); save("spt_last_sync",Date.now()); setStatus("ok"); setMsg("Restored ✓");

    return {...ag,hours,pay};

        agencies.map(ag=>

// ─── Dynamic tax rate store (built-ins + user-added, persisted in localStorage) ─
const BUILTIN_TAX_RATES = UK_TAX_RATES;
const loadTaxRates = () => {
  try {
    const stored = JSON.parse(localStorage.getItem("spt_tax_rates") || "null");
    if (stored && typeof stored === "object") return { ...BUILTIN_TAX_RATES, ...stored };
  } catch(e) {}
  return { ...BUILTIN_TAX_RATES };
};
const saveTaxRates = (rates) => {
  // Only persist user-added/edited years (not builtins, to keep file size down)
  const userRates = {};
  Object.keys(rates).forEach(y => {
    if (!BUILTIN_TAX_RATES[y] || JSON.stringify(rates[y]) !== JSON.stringify(BUILTIN_TAX_RATES[y])) {
      userRates[y] = rates[y];
    }
  });
  localStorage.setItem("spt_tax_rates", JSON.stringify(userRates));
};

// Returns rates for a given tax year label, falling back to the latest known
const getTaxRates = (taxYear, ratesOverride) => {
  const R = ratesOverride || loadTaxRates();
  if (taxYear && R[taxYear]) return R[taxYear];
  const keys = Object.keys(R).sort();
  return R[keys[keys.length - 1]];
};

// All known tax year labels for the selector — read at runtime so user additions appear

// ─── UK Net Pay Calculator ────────────────────────────────────────────────────
// Pass taxYear (e.g. "2025/26") — automatically uses the matching rate table.
const calcUKNetPay = (grossAnnual, taxCode, niCategory, studentLoan, pensionPct, otherMonthly, taxYear) => {
  const R = getTaxRates(taxYear);

  // Resolve personal allowance from tax code
  let personalAllowance = R.personalAllowance;
  if (taxCode === "BR" || taxCode === "0T") personalAllowance = 0;
  else if (taxCode === "NT") {
    return { gross: grossAnnual, incomeTax: 0, ni: 0, pension: 0, studentLoanAmt: 0, otherAnnual: otherMonthly * 12, net: grossAnnual - otherMonthly * 12 };
  } else if (taxCode === "D0") {
    const tax = grossAnnual * R.higherRate;
    const niAmt = calcNI(grossAnnual, niCategory, R);
    const penAmt = grossAnnual * ((parseFloat(pensionPct)||0) / 100);
    const sl = calcStudentLoan(grossAnnual, studentLoan, R);
    const other = otherMonthly * 12;
    return { gross: grossAnnual, incomeTax: tax, ni: niAmt, pension: penAmt, studentLoanAmt: sl, otherAnnual: other, net: grossAnnual - tax - niAmt - penAmt - sl - other };
  } else if (taxCode === "D1") {
    const tax = grossAnnual * R.additionalRate;
    const niAmt = calcNI(grossAnnual, niCategory, R);
    const penAmt = grossAnnual * ((parseFloat(pensionPct)||0) / 100);
    const sl = calcStudentLoan(grossAnnual, studentLoan, R);
    const other = otherMonthly * 12;
    return { gross: grossAnnual, incomeTax: tax, ni: niAmt, pension: penAmt, studentLoanAmt: sl, otherAnnual: other, net: grossAnnual - tax - niAmt - penAmt - sl - other };
  } else if (taxCode && taxCode.startsWith("K")) {
    const kNum = parseInt(taxCode.slice(1)) || 0;
    personalAllowance = -(kNum * 10);
  } else {
    // Standard L code (e.g. 1257L → £12,570 allowance)
    const num = parseInt(taxCode) || Math.round(R.personalAllowance / 10);
    personalAllowance = num * 10;
  }

  const pensionAmount = grossAnnual * ((parseFloat(pensionPct)||0) / 100);
  const taxableIncome = Math.max(0, grossAnnual - pensionAmount - personalAllowance);

  let incomeTax = 0;
  if (taxableIncome > 0) {
    const basicTop   = R.basicRateCeiling  - R.personalAllowance;
    const higherTop  = R.higherRateCeiling - R.personalAllowance;
    const basicBand  = Math.min(taxableIncome, basicTop);
    const higherBand = Math.min(Math.max(taxableIncome - basicTop, 0), higherTop - basicTop);
    const addlBand   = Math.max(taxableIncome - higherTop, 0);
    incomeTax = basicBand * R.basicRate + higherBand * R.higherRate + addlBand * R.additionalRate;
  }

  const niAmt = calcNI(grossAnnual, niCategory, R);
  const sl = calcStudentLoan(grossAnnual, studentLoan, R);
  const other = otherMonthly * 12;
  const net = grossAnnual - incomeTax - niAmt - pensionAmount - sl - other;
  return { gross: grossAnnual, incomeTax, ni: niAmt, pension: pensionAmount, studentLoanAmt: sl, otherAnnual: other, net: Math.max(0, net) };
};

const calcNI = (grossAnnual, niCategory, R) => {
  if (!R) R = getTaxRates();
  if (niCategory && niCategory.startsWith("C")) return 0;
  if (grossAnnual <= R.niPrimaryThreshold) return 0;
  const mainRate = niCategory && niCategory.startsWith("B") ? R.niMainRateCatB : R.niMainRateCatA;
  const mainNI = Math.min(grossAnnual, R.niUpperEarningsLimit) - R.niPrimaryThreshold;
  const addlNI = Math.max(grossAnnual - R.niUpperEarningsLimit, 0);
  return mainNI * mainRate + addlNI * R.niAdditionalRate;
};

const calcStudentLoan = (grossAnnual, plan, R) => {
  if (!plan || plan === "None") return 0;
  if (!R) R = getTaxRates();
  const entry = R.studentLoan[plan];
  if (!entry) return 0;
  return Math.max(0, grossAnnual - entry.threshold) * entry.rate;
};

        return r.net;
      },0);
      // Actually compute it properly

        return s+(r.net/periods)*periods;

      const combinedTakeHome = periodGross.reduce((s,{gross,pd})=>{

        const r=calcUKNetPay(gross*periods,pd.taxCode||"1257L",pd.niCategory||"A – Standard",pd.studentLoan||"None",pd.pension||0,parseFloat(pd.otherDeductions)||0,pd.taxYear);

// ─── PDF Export ───────────────────────────────────────────────────────────────
const exportPDF = (year, month, who, agencies, shifts, payDetails, myName, partnerName, prefs) => {
  const name = who === "partner" ? (partnerName || "Person 2") : (myName || "Person 1");
  const monthStr = MONTHS[month] + " " + year;
  const daysInMonth = getDaysInMonth(year, month);
  const details = payDetails || [];
  const freqPeriods = { "Weekly": 52, "Fortnightly": 26, "Monthly": 12, "4-weekly": 13 };

  // Collect all shifts for the month
  const rows = [];
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const dayDate = new Date(dateStr + "T00:00:00");
    const dayLabel = dayDate.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
    agencies.forEach(ag => {
      const sh = shifts[`${dateStr}_${ag.id}`];
      if (!sh) return;
      rows.push({ dateStr, dayLabel, ag, sh });
    });
  }

  // Total gross
  const agTotals = agencies.map(ag => {
    const agRows = rows.filter(r => r.ag.id === ag.id && r.sh.working);
    const gross = agRows.reduce((s, r) => s + shiftPay(r.sh, ag.rate), 0);
    const hours = agRows.reduce((s, r) => s + shiftHours(r.sh), 0);
    const pd = details.find(d => d.agencyId === ag.id) || {};
    let netSection = "";
    if (pd.taxCode) {
      const periods = freqPeriods[pd.frequency || "Monthly"] || 12;
      const annualGross = gross * periods;
      const result = calcUKNetPay(annualGross, pd.taxCode, pd.niCategory || "A – Standard", pd.studentLoan || "None", pd.pension || 0, parseFloat(pd.otherDeductions) || 0, pd.taxYear);
      const scale = 1 / periods;
      netSection = `
        <tr class="net-row"><td colspan="4"></td><td>Income Tax</td><td class="amt ded">−${fmtGBP(result.incomeTax * scale)}</td></tr>
        <tr class="net-row"><td colspan="4"></td><td>National Insurance</td><td class="amt ded">−${fmtGBP(result.ni * scale)}</td></tr>
        ${result.pension > 0 ? `<tr class="net-row"><td colspan="4"></td><td>Pension (${pd.pension}%)</td><td class="amt ded">−${fmtGBP(result.pension * scale)}</td></tr>` : ""}
        ${result.studentLoanAmt > 0 ? `<tr class="net-row"><td colspan="4"></td><td>Student Loan</td><td class="amt ded">−${fmtGBP(result.studentLoanAmt * scale)}</td></tr>` : ""}
        <tr class="net-total"><td colspan="4"></td><td><strong>Est. Take-Home</strong></td><td class="amt net"><strong>${fmtGBP(result.net * scale)}</strong></td></tr>
      `;
    }
    return { ag, gross, hours, days: agRows.length, pd, netSection };
  });

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"/>
  <title>Shifto – ${name} – ${monthStr}</title>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11pt; color: #111; margin: 20px 28px; }
    h1 { font-size: 20pt; color: #1a3a1a; margin-bottom: 2px; }
    .sub { color: #555; font-size: 10pt; margin-bottom: 18px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th { background: #1a3a1a; color: #fff; padding: 7px 10px; text-align: left; font-size: 9.5pt; }
    td { padding: 5px 10px; border-bottom: 1px solid #e5e5e5; font-size: 10pt; vertical-align: top; }
    tr:nth-child(even) td { background: #f9f9f9; }
    .amt { text-align: right; font-family: monospace; }
    .workplace-header { background: #eef5ee; font-weight: bold; color: #1a3a1a; }
    .gross-row td { background: #f0f8f0; }
    .net-row td { background: #fff8e8; color: #555; font-size: 9.5pt; }
    .net-total td { background: #e8f5e8; font-size: 11pt; }
    .ded { color: #c0392b; }
    .net { color: #1a5c28; }
    .tag { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 8.5pt; }
    .working { background: #e8f5e8; color: #1a5c28; }
    .off { background: #fde8e8; color: #c0392b; }
    .sleepover { background: #e8e0ff; color: #5b3d9e; }
    @media print {
      body { margin: 10px 14px; }
      button { display: none; }
    }
    .print-btn { background: #1a3a1a; color: #fff; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 11pt; margin-bottom: 14px; }
  </style></head><body>
  <button class="print-btn" onclick="window.print()">🖨 Print / Save as PDF</button>
  <h1>Shifto · Shift Report</h1>
  <div class="sub">${name} · ${monthStr} · Generated ${new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}</div>
  <table>
    <thead><tr><th>Date</th><th>Day</th><th>Workplace</th><th>Hours</th><th>Detail</th><th>Gross</th></tr></thead>
    <tbody>
    ${rows.map(({ dayLabel, ag, sh }) => `
      <tr>
        <td>${dayLabel}</td>
        <td><span class="tag ${sh.working ? "working" : "off"}">${sh.working ? "Working" : "Day Off"}</span></td>
        <td>${ag.name}</td>
        <td>${sh.working ? fmtHours(shiftHours(sh)) : "–"}</td>
        <td>${sh.working ? (sh.startTime || "") + (sh.endTime ? " – " + sh.endTime : "") : ""}${sh.hasSleepover ? ' <span class="tag sleepover">💤 Sleepover</span>' : ""}${sh.note ? '<br><em style="color:#777;font-size:9pt;">' + sh.note + "</em>" : ""}</td>
        <td class="amt">${sh.working ? fmtGBP(shiftPay(sh, ag.rate)) : "–"}</td>
      </tr>`).join("")}
    ${agTotals.map(({ ag, gross, hours, days, netSection }) => `
      <tr class="gross-row">
        <td colspan="3"><strong>${ag.name} Total</strong> · ${days} shift${days !== 1 ? "s" : ""}</td>
        <td>${fmtHours(hours)}</td>
        <td>Gross Pay</td>
        <td class="amt"><strong>${fmtGBP(gross)}</strong></td>
      </tr>
      ${netSection}
    `).join("")}
    </tbody>
  </table>
  <div style="font-size:9pt;color:#888;margin-top:10px;">⚠ Net pay estimates are based on 2024/25 UK tax rates. For accurate figures consult your payslip or a qualified accountant.</div>
  </body></html>`;

  // Use blob URL — window.open("","_blank") is blocked on mobile browsers
  try {
    const blob = new Blob([html], {type:"text/html"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Shifto_${name.replace(/\s+/g,"_")}_${MONTHS[month]}_${year}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 10000);
  } catch(e) {
    // Fallback: try popup
    const win = window.open("", "_blank");
    if (win) { win.document.write(html); win.document.close(); }
  }
};

      React.createElement("div",{style:{fontSize:12,color:acText3,fontFamily:"'DM Sans',sans-serif",marginBottom:12,lineHeight:1.6}},"Sign in with Google once — all data syncs automatically. Open on any device and tap Restore."),
      React.createElement(GoogleSync,{getData:getAllData,onRestore})
    ),

    React.createElement(SL,{th},"Backup & Restore"),
    React.createElement(C,{th},
      React.createElement("div",{style:{fontSize:12,color:acText3,fontFamily:"'DM Sans',sans-serif",marginBottom:12,lineHeight:1.6}},"Export saves all shifts for both of you, all workplaces and settings."),
      React.createElement("div",{style:{display:"flex",gap:8,marginBottom:8}},
        React.createElement("button",{onClick:()=>exportData(false),style:{flex:1,padding:"11px",borderRadius:10,background:`${GREEN}18`,border:`1px solid ${GREEN}44`,color:GREEN,fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:13,cursor:"pointer"}},"⬇ Save to Files"),
        React.createElement("button",{onClick:()=>exportData(true),style:{flex:1,padding:"11px",borderRadius:10,background:`${acBlue}18`,border:`1px solid ${acBlue}44`,color:acBlue,fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:13,cursor:"pointer"}},"✉ Email Backup")
      ),
      React.createElement("button",{onClick:exportCSV,style:{width:"100%",padding:"11px",borderRadius:10,background:`${GREEN}12`,border:`1px solid ${GREEN}33`,color:GREEN,fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:13,cursor:"pointer",marginBottom:8}},"📊 Export CSV"),
      React.createElement("button",{onClick:()=>{
        const inp=document.createElement("input");
        inp.type="file"; inp.accept=".json";
        inp.onchange=e=>{const f=e.target.files[0];if(f)importData(f);};
        document.body.appendChild(inp); inp.click(); document.body.removeChild(inp);
      },style:{width:"100%",padding:"11px",borderRadius:10,background:`${acBlue}12`,border:`1px solid ${acBlue}33`,color:acBlue,fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:13,cursor:"pointer"}},"⬆ Import Backup"),
      importStatus&&React.createElement("div",{style:{marginTop:10,fontSize:12,color:importStatus==="success"?GREEN:RED,fontFamily:"'DM Sans',sans-serif",textAlign:"center"}},importStatus==="success"?"✓ Restored successfully":"✕ Invalid file")
    ),

    React.createElement(SL,{th},"Pay Details"),
    React.createElement(C,{th},
      React.createElement("div",{style:{fontSize:12,color:acText3,fontFamily:"'DM Sans',sans-serif",marginBottom:12,lineHeight:1.6}},"Enter tax codes, pay frequency and deductions so Shifto can estimate your take-home pay."),
      React.createElement("button",{
        onClick:()=>setShowPayModal(true),
        style:{width:"100%",padding:"13px",borderRadius:10,background:`${acBlue}18`,border:`1px solid ${acBlue}44`,color:acBlue,fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}
      },"💷 Enter Pay Details")
    ),

    React.createElement(SL,{th},"UK Tax Rates"),
    React.createElement(C,{th},
      React.createElement("div",{style:{fontSize:12,color:acText3,fontFamily:"'DM Sans',sans-serif",marginBottom:12,lineHeight:1.6}},
        `${taxYearOptions.length} tax year${taxYearOptions.length!==1?"s":""} configured (${taxYearOptions.join(", ")}). Add a new year each April when HMRC announces updated figures.`
      ),
      React.createElement("button",{
        onClick:()=>setShowTaxRatesModal(true),
        style:{width:"100%",padding:"13px",borderRadius:10,background:`${GREEN}18`,border:`1px solid ${GREEN}44`,color:GREEN,fontFamily:"'DM Sans',sans-serif",fontWeight:700,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}
      },"📊 Manage Tax Rates")
    ),

    React.createElement(SL,{th},"About"),
    React.createElement(C,{th,style:{padding:"12px 14px"}},
      React.createElement("div",{style:{fontSize:12,color:acText3,fontFamily:"'DM Sans',sans-serif",lineHeight:1.8}},
        React.createElement("div",{style:{color:acText2,fontWeight:700,marginBottom:2}},prefs.appName," · Shift & Pay Tracker v",DATA_VERSION),
        "Tracks shifts for you and your partner · Rolling rota · Google Drive sync · Works offline"
      )
    ),

    showPayModal&&React.createElement(PayDetailsModal,{
      th,prefs,setPrefs,
      myAgencies,partnerAgencies,
      onClose:()=>setShowPayModal(false)
    }),
    showTaxRatesModal&&React.createElement(TaxRatesModal,{
      th,
      onClose:()=>setShowTaxRatesModal(false),
      onRatesChanged:(updated)=>setTaxRates(updated)
    })
  );
};

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  // Run migration on first load
  useEffect(()=>{ migrateData(); },[]);

  const [myAgencies,setMyAgencies] = useState(()=>load("spt_agencies",DEFAULT_MY_AGENCIES));
  const [myShifts,setMyShifts] = useState(()=>load("spt_shifts",{}));
  const [partnerAgencies,setPartnerAgencies] = useState(()=>load("spt_partner_agencies",DEFAULT_PARTNER_AGENCIES));
  const [partnerShifts,setPartnerShifts] = useState(()=>load("spt_partner_shifts",{}));
  const [prefs,setPrefs] = useState(()=>{
    const p=load("spt_prefs",null);
    if (!p) return DEFAULT_PREFS;
    return {...DEFAULT_PREFS,...p,weekStartDay:typeof p.weekStartDay==="number"?p.weekStartDay:DEFAULT_PREFS.weekStartDay};
  });
  const [tab,setTab] = useState("week");
  const TABS_LIST = useMemo(()=>[
    {id:"week",icon:"📋",label:prefs.myName||"Person 1"},
    {id:"partner",icon:"👫",label:prefs.partnerName||"Person 2"},
    {id:"reports",icon:"📊",label:"Reports"},
    {id:"settings",icon:"⚙️",label:"Settings"}
  ],[prefs.myName,prefs.partnerName]);

  useEffect(()=>{ save("spt_agencies",myAgencies); },[myAgencies]);
  useEffect(()=>{ save("spt_shifts",myShifts); triggerAutoSync(); },[myShifts]);
  useEffect(()=>{ save("spt_partner_agencies",partnerAgencies); },[partnerAgencies]);
  useEffect(()=>{ save("spt_partner_shifts",partnerShifts); triggerAutoSync(); },[partnerShifts]);
  useEffect(()=>{ save("spt_prefs",prefs); },[prefs]);

  // ── Firebase live sync ──
  const [fbStatus, setFbStatus] = useState("idle"); // idle | syncing | synced | error
  useEffect(()=>{
    registerFbOnRestore(data => {
      if (data.myAgencies) setMyAgencies(data.myAgencies);
      if (data.myShifts) setMyShifts(data.myShifts);
      if (data.partnerAgencies) setPartnerAgencies(data.partnerAgencies);
      if (data.partnerShifts) setPartnerShifts(data.partnerShifts);
      if (data.prefs) setPrefs(p=>({...DEFAULT_PREFS,...data.prefs}));
      setFbStatus("synced");
    });
    initFirebaseSync();
  },[]);

  const fbSyncData = useMemo(()=>({
    myAgencies, myShifts, partnerAgencies, partnerShifts, prefs
  }),[myAgencies, myShifts, partnerAgencies, partnerShifts, prefs]);

  const isMounted = useRef(false);
  useEffect(()=>{
    if (!isMounted.current) { isMounted.current=true; return; }
    setFbStatus("syncing");
    fbPushDebounced({...fbSyncData, _syncedAt: new Date().toISOString()});
    const t = setTimeout(()=>setFbStatus("synced"), 2500);
    return ()=>clearTimeout(t);
  },[fbSyncData]);

  // Auto-sync setup
  const autoSyncTimer = useRef(null);
  const getAllData = useCallback(()=>({
    version:DATA_VERSION, exportedAt:new Date().toISOString(),
    myAgencies, myShifts, partnerAgencies, partnerShifts, prefs,
    agencies:myAgencies, shifts:myShifts
  }),[myAgencies,myShifts,partnerAgencies,partnerShifts,prefs]);

  useEffect(()=>{
    registerAutoSync(()=>{
      clearTimeout(autoSyncTimer.current);
      autoSyncTimer.current=setTimeout(async()=>{
        if (!load("spt_auto_sync",false)) return;
        try { await gDrive.save(getAllData()); save("spt_last_sync",Date.now()); } catch {}
      },3000);
    });
  },[getAllData]);

  const onRestore = data => {
    if (data.myAgencies) setMyAgencies(data.myAgencies); else if (data.agencies) setMyAgencies(data.agencies);
    if (data.myShifts) setMyShifts(data.myShifts); else if (data.shifts) setMyShifts(data.shifts);
    if (data.partnerAgencies) setPartnerAgencies(data.partnerAgencies);
    if (data.partnerShifts) setPartnerShifts(data.partnerShifts);
    if (data.prefs) setPrefs({...DEFAULT_PREFS,...data.prefs});
  };

  const onApplyRota = rotaConfig => {
    setPartnerShifts(prev=>applyRota(rotaConfig,partnerAgencies,prev));
  };

  const PARTNER_PRESETS = [{label:"7–7",start:"07:00",end:"19:00"},{label:"7–1",start:"07:00",end:"13:00"}];
  const headerHeight = "calc(env(safe-area-inset-top, 0px) + 108px)";

  const isDark = (prefs.theme||"dark")==="dark";
  const T = {
    // Backgrounds — light: warm off-white/cream; dark: deep forest green
    bg:         isDark ? "#0d2b24" : "#f5f0e8",
    bg2:        isDark ? "#153830" : "#faf6ee",
    bg3:        isDark ? "#1c453c" : "#ede6d8",
    // Borders — strong dark green in light for sharp contrast
    border:     isDark ? "#24574c" : "#1e5c30",
    border2:    isDark ? "#2e6b5e" : "#2a7040",
    // Text — near-black in light for max contrast
    text:       isDark ? "#fdf6ee" : "#0a1208",
    text2:      isDark ? "#c8e8d8" : "#0f2010",
    text3:      isDark ? "#7ab8a4" : "#1a3a1a",
    // Cards — clean white so they stand off the cream bg
    card:       isDark ? "#153830" : "#ffffff",
    cardBorder: isDark ? "#24574c" : "#1e5c30",
    // Section backgrounds
    section:    isDark ? "#153830" : "#ffffff",
    sectionBg:  isDark ? "#0d2b24" : "#f5f0e8",
    // Yellow highlight — used for active pills, selected state, badges
    yellow:     "#f2d87e",
    yellowText: "#0a1208",
    // Header
    header:     isDark ? "rgba(13,43,36,0.97)" : "rgba(245,240,232,0.97)",
    headerBorder: isDark ? "#24574c" : "#1e5c30",
    // Coral/salmon accent — dark forest green in light for contrast on cream
    blue:       isDark ? "#f0a89a" : "#1a5c28",
    blueText:   isDark ? "#f0a89a" : "#1a5c28",
    blueLight:  isDark ? "rgba(240,168,154,0.15)" : "rgba(26,92,40,0.10)",
    blueBorder: isDark ? "rgba(240,168,154,0.32)" : "rgba(26,92,40,0.35)",
    // Section label — dark green on cream
    sectionLabel: isDark ? "#7ab8a4" : "#1a3a1a",
    // Inputs — white, dark green border
    input:      isDark ? "#1c453c" : "#ffffff",
    inputBorder:isDark ? "#2e6b5e" : "#1e5c30",
  };

  const onThemeToggle = () => setPrefs(p=>({...p,theme:(p.theme||"dark")==="dark"?"light":"dark"}));

  useEffect(()=>{
    document.body.style.background = T.bg;
    document.body.style.color = T.text;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = T.bg;
  },[T.bg,T.text]);

  return React.createElement(React.Fragment,null,
    React.createElement("style",null,`
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800;900&family=DM+Mono:wght@400;500;700&display=swap');
      *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
      html,body{height:100%;background:${T.bg};color:${T.text};overflow-x:hidden;}
      input[type="time"]::-webkit-calendar-picker-indicator{filter:${isDark?"invert(0.35)":"invert(0.4) sepia(0.3)"};}
      input[type="date"]::-webkit-calendar-picker-indicator{filter:${isDark?"invert(0.35)":"invert(0.4) sepia(0.3)"};}
      select option{background:${T.bg2};color:${T.text};}
      ::-webkit-scrollbar{width:0;}
      #root{height:100%;}
    `),
    React.createElement("div",{style:{maxWidth:430,margin:"0 auto",minHeight:"100dvh",background:T.bg}},
      React.createElement(AppHeader,{appName:prefs.appName||"Shifto",myAgencies,partnerAgencies,tab,onTabChange:setTab,tabs:TABS_LIST,theme:prefs.theme||"dark",onThemeToggle,T,fbStatus}),
      React.createElement("div",{style:{position:"fixed",top:headerHeight,bottom:0,left:0,right:0,maxWidth:430,margin:"0 auto",display:"flex",flexDirection:"column",overflow:"hidden",background:T.bg}},
        tab==="week"&&React.createElement(WeeklyView,{
          key:prefs.weekStartDay,
          agencies:myAgencies,shifts:myShifts,setShifts:setMyShifts,
          weekStartDay:prefs.weekStartDay,accentColor:T.blue,
          partnerShifts,partnerAgencies,
          targetHours:prefs.weeklyTargetHours||0,
          theme:prefs.theme||"dark",
          payDetails:prefs.myPayDetails,
          summaryPeriod:prefs.summaryPeriod||"weekly"
        }),
        tab==="partner"&&React.createElement(WeeklyView,{
          key:`p${prefs.weekStartDay}`,
          agencies:partnerAgencies,shifts:partnerShifts,setShifts:setPartnerShifts,
          weekStartDay:prefs.weekStartDay,accentColor:ORANGE,presets:PARTNER_PRESETS,
          partnerShifts:myShifts,partnerAgencies:myAgencies,
          isPartnerView:true,
          theme:prefs.theme||"dark",
          payDetails:prefs.partnerPayDetails,
          summaryPeriod:prefs.summaryPeriod||"weekly"
        }),
        tab==="reports"&&React.createElement(ReportsView,{myAgencies,myShifts,partnerAgencies,partnerShifts,weekStartDay:prefs.weekStartDay,partnerName:prefs.partnerName,myName:prefs.myName||"Person 1",prefs,T}),
        tab==="settings"&&React.createElement(SettingsView,{myAgencies,setMyAgencies,partnerAgencies,setPartnerAgencies,shifts:myShifts,setShifts:setMyShifts,partnerShifts,setPartnerShifts,prefs,setPrefs,getAllData,onRestore,onApplyRota,T,fbSyncStatus:fbStatus})
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App,null));
  </script>
</body>
</html>
